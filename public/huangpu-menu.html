<script>

var HALL = '黃埔二店', cur = '全部', items = [];
function draw() {
  var cats = []; items.forEach(function (i) { if (cats.indexOf(i.cat) < 0) cats.push(i.cat); });
  document.getElementById('cats').innerHTML = cats.length > 1 ? ['全部'].concat(cats).map(function (c) {
    return '<button class="chip' + (c === cur ? ' on' : '') + '" data-c2="' + Z.esc(c) + '">' + Z.esc(c) + '</button>'; }).join('') : '';
  var show = cats.filter(function (c) { return cur === '全部' || c === cur; });
  document.getElementById('menu').innerHTML = !items.length ? '<div class="skel">' + Z.ct('黃埔餐點|空白提示', '餐點即將更新，敬請期待。') + '</div>' : show.map(function (c) {
    return '<div style="margin-bottom:56px"><div class="h" style="font-size:28px;margin-bottom:8px">' + Z.esc(c) + '</div><div class="list">' +
      items.filter(function (i) { return i.cat === c; }).map(function (i) {
        var p = Z.isPlaceholder(i.price) ? '' : '<div class="pr">$' + Z.esc(String(i.price).replace(/^\$/, '')) + '</div>';
        return '<div class="m">' + Z.photo(i.image, i.name) + '<div class="mt"><b>' + Z.esc(i.name) + '</b><span>' + Z.esc(i.desc) + '</span></div>' + p + '</div>';
      }).join('') + '</div></div>';
  }).join('');
}
document.addEventListener('click', function (e) { var b = e.target.closest('[data-c2]'); if (b) { cur = b.getAttribute('data-c2'); draw(); } });
Z.init('huangpu-menu', function (d) { items = d.menu.filter(function (m) { return m.hall === HALL; }); draw(); });
</script>
