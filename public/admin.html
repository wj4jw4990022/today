function shrink(file) {
  return new Promise(function (res, rej) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, 2400 / Math.max(w, h)); // 原圖保存：長邊最多 2400
      w = Math.round(w * k); h = Math.round(h * k);
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      Crop.jpeg(c, 1400000).then(res, function () { rej(new Error('圖片處理失敗')); });
    };
    img.onerror = function () { rej(new Error('這個檔案無法讀取。請使用 JPG、PNG 或 WebP（iPhone 的 HEIC 請先轉成 JPG）')); };
    img.src = url;
  });
}
function b64(blob) {
  return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(',')[1]); }; r.onerror = rej; r.readAsDataURL(blob); });
}
/* ---------- 圖片：每個位置固定比例，上傳後先裁切；原圖一起保存，之後可重新裁切 ---------- */
var SLOT = {
  wide: { ratio: [3, 2], out: [1800, 1200], label: '3 : 2' },
  gal: { ratio: [4, 3], out: [1600, 1200], label: '4 : 3' },
  sq: { ratio: [1, 1], out: [1000, 1000], label: '1 : 1' },
  og: { ratio: [1200, 630], out: [1200, 630], label: '1.91 : 1' }
};
function slotOfKey(k) { return k === '首頁|分享圖片' ? SLOT.og : SLOT.wide; }
function imgId(u) { var m = /^\/img\/([\w-]+)$/.exec(u || ''); return m ? m[1] : ''; }
function cropUpload(img, target, slot, info, crop, origId) {
  return Crop.open(Object.assign({ img: img, crop: crop }, slot, info)).then(function (r) {
    if (!r) return null;
    toast('上傳中…');
    return b64(r.blob).then(function (d) { return call('adminUploadImage', { target: target, name: 'crop.jpg', data: d, origId: origId, crop: r.crop }); }).then(function (x) { return x.url; });
  });
}
function upload(file, target, slot, info) {
  if (!/^image\//.test(file.type) && !/\.(jpe?g|png|webp|heic)$/i.test(file.name)) return Promise.reject(new Error('請選擇圖片檔'));
  return Crop.load(file).then(function (img) {
    return Crop.open(Object.assign({ img: img, name: file.name }, slot, info)).then(function (r) {
      if (!r) return null;
      toast('上傳中…');
      return shrink(file).then(b64).then(function (d) { return call('adminUploadImage', { target: target, name: file.name, data: d }); }).then(function (o) {
        return b64(r.blob).then(function (d) { return call('adminUploadImage', { target: target, name: file.name, data: d, origId: imgId(o.url), crop: r.crop }); });
      }).then(function (x) { return x.url; });
    });
  });
}
/* 重新裁切已上傳的圖：用原圖與上次的範圍打開裁切視窗 */
function recrop(url, target, slot, info, done) {
  if (!url) { toast('還沒有圖片'); return; }
  if (!imgId(url)) { toast('這張是外部連結的圖片，請按「上傳」重新上傳一次，之後就能裁切'); return; }
  toast('讀取原圖…');
  call('adminImageInfo', { url: url }).then(function (r) {
    return Crop.load(r.orig).then(function (img) { return cropUpload(img, target, slot, Object.assign({ name: '原圖' }, info), r.crop, imgId(r.orig)); });
  }).then(function (u) { if (u) { toast('已裁切，記得按「儲存」'); done(u); } }).catch(function (e) { toast(e.message); });
}

  m.innerHTML = '<div class="pcbox"><div class="pch">確認儲存「' + E(SE.s.name) + '」　' + ds.length + ' 處修改</div><div class="pcbd">' + rows + '</div><div class="pcft"><button class="btn" id="seOk">確認儲存</button> <button class="btn line" id="seNo">回去繼續改</button></div></div>';
  document.body.appendChild(m);
  $('seNo').onclick = function () { m.remove(); };
  $('seOk').onclick = function () { $('seOk').disabled = true; seSave().then(function () { m.remove(); toast('已儲存「' + SE.s.name + '」'); clearW(); vShopEdit(); }).catch(function (er) { toast(er.message); $('seOk').disabled = false; }); };
}
function seItemDiff() {
  var b = SE.base.items, c = SE.cur.items, add = c.filter(function (i) { return !i.id; }).length, del = b.filter(function (i) { return !c.some(function (x) { return x.id === i.id; }); }).length;
  var chg = c.filter(function (i, idx) { return i.id && JSON.stringify(i) !== JSON.stringify(b.filter(function (x) { return x.id === i.id; })[0]) || (i.id && b.map(function (x) { return x.id; }).indexOf(i.id) !== idx); }).length;
  return '新增 ' + add + '、修改 ' + chg + '、刪除 ' + del;
}
function seSave() {
  var s = SE.s, c = SE.cur, b = SE.base, ds = seDirty().map(function (f) { return f[0]; }), has = function (a) { return a.some(function (k) { return ds.indexOf(k) >= 0; }); }, f = {};
  if (has(['name'])) f['店名'] = c.name; if (has(['type'])) f['類型'] = c.type;
  if (has(['floorA', 'floorB'])) f['樓層'] = c.floorA + (c.floorB ? ' ' + c.floorB : '');
  if (has(['hs', 'he'])) { f['營業開始'] = c.hs; f['營業結束'] = c.he; }
  if (has(['hr'])) f['營業時間'] = c.hr; if (has(['sh'])) f['首頁顯示營業時間'] = c.sh;
  if (has(['intro'])) f['介紹'] = c.intro; if (has(['tagline'])) f['一句話介紹'] = c.tagline;
  if (has(['btnMode'])) f['按鈕模式'] = c.btnMode; if (has(['btnText'])) f['按鈕文字'] = c.btnText; if (has(['phone'])) f['電話'] = c.phone;
  if (has(['ig'])) f['Instagram'] = c.ig; if (has(['fb'])) f['Facebook'] = c.fb; if (has(['line'])) f['LINE'] = c.line;
  if (has(['image'])) f['圖片網址'] = c.image; if (has(['gallery'])) f['相簿圖片'] = c.gallery; if (has(['itemsTitle'])) f['項目標題'] = c.itemsTitle;
  var p = Object.keys(f).length ? call('adminSaveShop', { shopId: s.id, fields: f }) : Promise.resolve();
  if (has(['items'])) p = p.then(function () {
    var ops = [];
    b.items.forEach(function (i) { if (!c.items.some(function (x) { return x.id === i.id; })) ops.push(function () { return call('adminDeleteItem', { shopId: s.id, id: i.id }); }); });
    c.items.forEach(function (i, idx) {
      var old = i.id ? b.items.filter(function (x) { return x.id === i.id; })[0] : null, oldIdx = old ? b.items.indexOf(old) : -1;
      if (old && oldIdx === idx && JSON.stringify(old) === JSON.stringify(i)) return;
      if (!i.name.trim()) throw new Error('第 ' + (idx + 1) + ' 個項目沒有名稱');
      ops.push(function () { return call('adminSaveItem', { shopId: s.id, item: { id: i.id, cat: i.cat, name: i.name, desc: i.desc, price: i.price, image: i.image, on: i.on, order: idx + 1 } }); });
    });
    return ops.reduce(function (ch, fn) { return ch.then(fn); }, Promise.resolve());
  });
  return p;
}
document.addEventListener('click', function (e) {
  var t = e.target, b; if (!SE || view !== 'shopedit') return;
  if ((b = t.closest('[data-sereg]'))) { seSelect(Number(b.getAttribute('data-sereg')), true); return; }
  if ((b = t.closest('[data-seshop]'))) { if (b.getAttribute('data-seshop') === SE.s.id || !guard()) return; shopSel = b.getAttribute('data-seshop'); vShopEdit(); return; }
  if ((b = t.closest('[data-sedev]'))) { var mob = b.getAttribute('data-sedev') === 'mob'; $('seFw').classList.toggle('mob', mob); document.querySelectorAll('#seDev button').forEach(function (x) { x.classList.toggle('on', x === b); }); seScale(); return; }
  if (t.closest('[data-seshared]')) { if (!guard()) return; window._pcGo = 'shop'; view = 'content'; drawTabs(); show(); return; }
  if (t.closest('#seSave')) { seConfirm(); return; }
  if (t.closest('#seReset')) { if (!SE.cur || !seDirty().length || confirm('放棄所有未儲存的修改？')) { SE.cur = JSON.parse(JSON.stringify(SE.base)); seDraw(); sePost(); } return; }
  function seMain(u) { SE.cur.image = u; var im = $('seImg'); if (im) { im.src = u; im.style.visibility = 'visible'; } seChanged(); }
  var seInfo = function (tt) { return { title: tt, crumb: shopName(SE.s.id) }; };
  if (t.closest('[data-seimgup]')) { pickFiles(false, 'shop:' + SE.s.id, function (u) { if (u[0]) seMain(u[0]); }, SLOT.wide, seInfo('主圖')); return; }
  if (t.closest('[data-seimgcrop]')) { recrop(SE.cur.image, 'shop:' + SE.s.id, SLOT.wide, seInfo('主圖'), seMain); return; }
  if (t.closest('[data-seimgclr]')) { SE.cur.image = ''; $('seImg').style.visibility = 'hidden'; seChanged(); return; }
  if ((b = t.closest('[data-seitadd]'))) { SE.cur.items.push({ id: '', cat: '', name: '', desc: '', price: '', image: '', on: true }); seDrawItems(); seChanged(); var ins = document.querySelectorAll('#seItems .icard input[data-sef=name]'); if (ins.length) ins[ins.length - 1].focus(); return; }
  if ((b = t.closest('[data-seitup]'))) { var ii = Number(b.getAttribute('data-seitup')); pickFiles(false, 'shop:' + SE.s.id, function (u) { if (u[0]) { SE.cur.items[ii].image = u[0]; seDrawItems(); seChanged(); } }, SLOT.sq, seInfo('項目圖片')); return; }
  if ((b = t.closest('[data-seitcrop]'))) { var ij = Number(b.getAttribute('data-seitcrop')); recrop(SE.cur.items[ij].image, 'shop:' + SE.s.id, SLOT.sq, seInfo('項目圖片'), function (u) { SE.cur.items[ij].image = u; seDrawItems(); seChanged(); }); return; }
  if ((b = t.closest('[data-seitmv]'))) { var p = b.getAttribute('data-seitmv').split(','), i = Number(p[0]), j = i + Number(p[1]), its = SE.cur.items; if (j >= 0 && j < its.length) { var x = its[i]; its[i] = its[j]; its[j] = x; seDrawItems(); seChanged(); } return; }
  if ((b = t.closest('[data-seitdel]'))) { var di = Number(b.getAttribute('data-seitdel')); if (!SE.cur.items[di].id || confirm('刪除「' + (SE.cur.items[di].name || '這個項目') + '」？按「儲存」後才會真的刪除。')) { SE.cur.items.splice(di, 1); seDrawItems(); seChanged(); } return; }
  var g = SE.cur.gallery;
  if ((b = t.closest('[data-segrm]'))) { g.splice(Number(b.getAttribute('data-segrm')), 1); seDrawGal(); seChanged(); return; }
  if ((b = t.closest('[data-segmv]'))) { var q = b.getAttribute('data-segmv').split(','), a1 = Number(q[0]), a2 = a1 + Number(q[1]); if (a2 >= 0 && a2 < g.length) { var y = g[a1]; g[a1] = g[a2]; g[a2] = y; seDrawGal(); seChanged(); } return; }
  if ((b = t.closest('[data-segcrop]'))) { var kg = Number(b.getAttribute('data-segcrop')); recrop(g[kg], 'shop:' + SE.s.id, SLOT.gal, seInfo('相簿照片'), function (u) { SE.cur.gallery[kg] = u; seDrawGal(); seChanged(); }); return; }
  if ((b = t.closest('[data-segmain]'))) {
    /* 相簿照片設為主圖：先裁成主圖的 3:2；原本的主圖放回相簿（再裁成 4:3，取消就不放回） */
    var k = Number(b.getAttribute('data-segmain')), old = SE.cur.image, sid = 'shop:' + SE.s.id;
    recrop(g[k], sid, SLOT.wide, seInfo('主圖（從相簿設定）'), function (nu) {
      seMain(nu);
      function put(v) { if (v) SE.cur.gallery[k] = v; else SE.cur.gallery.splice(k, 1); seDrawGal(); seChanged(); }
      if (old && imgId(old)) recrop(old, sid, SLOT.gal, seInfo('原本的主圖放進相簿'), put); else put(old && isHttps(old) ? old : '');
    });
    return;
  }
  if (t.closest('[data-segadd]')) { pickFiles(true, 'shop:' + SE.s.id, function (u) { SE.cur.gallery = SE.cur.gallery.concat(u).filter(function (v, i2, a) { return a.indexOf(v) === i2; }).slice(0, 12); seDrawGal(); seChanged(); }, SLOT.gal, seInfo('相簿照片')); return; }
});

function vInq() {
  call('adminInquiries').then(function (rows) {
    $('pg').innerHTML = rows.length ? '<div class="tw"><table><tr><th>時間</th><th>類型</th><th>單位 / 聯絡人</th><th>聯絡方式</th><th>內容</th><th>狀態</th></tr>' + rows.map(function (r) {
      return '<tr><td>' + E(r.time) + '</td><td>' + E(r.type) + '</td><td>' + E(r.org) + '<br>' + E(r.name) + '</td><td>' + E(r.phone) + '<br>' + E(r.email) + '</td><td style="max-width:360px;white-space:pre-wrap">' + E(r.message) + '</td><td><select class="st" data-row="' + r.row + '">' + ['新', '處理中', '已回覆', '結案'].map(function (s) { return '<option' + (s === r.status ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></td></tr>';
    }).join('') + '</table></div>' : '<div class="skel">目前沒有洽談資料。</div>';
    document.querySelectorAll('select[data-row]').forEach(function (s) { s.onchange = function () { call('adminSetInquiryStatus', { row: s.getAttribute('data-row'), status: s.value }).then(function () { toast('已更新'); }); }; });
  }).catch(err);
}
