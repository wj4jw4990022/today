function shrink(file) {
  return new Promise(function (res, rej) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, 1600 / Math.max(w, h));
      w = Math.round(w * k); h = Math.round(h * k);
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(function (b) { b ? res(b) : rej(new Error('圖片處理失敗')); }, 'image/jpeg', 0.85);
    };
    img.onerror = function () { rej(new Error('這個檔案無法讀取。請使用 JPG、PNG 或 WebP（iPhone 的 HEIC 請先轉成 JPG）')); };
    img.src = url;
  });
}
function b64(blob) {
  return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(',')[1]); }; r.onerror = rej; r.readAsDataURL(blob); });
}
function upload(file, target) {
  if (!/^image\//.test(file.type) && !/\.(jpe?g|png|webp|heic)$/i.test(file.name)) return Promise.reject(new Error('請選擇圖片檔'));
  return shrink(file).then(b64).then(function (d) { return call('adminUploadImage', { target: target, name: file.name, data: d }); });
}

  $('sp').innerHTML = '<p class="sd">這裡是價格與營運規則（只有總管理員看得到）。只能改「值」；說明欄有「待主管批准」的項目，請先確認再改。改完按該列「儲存」。</p><div class="tw hn"><table><tr><th>設定項目</th><th>值</th><th>說明</th><th>狀態</th><th></th></tr>' +
    r.settings.map(function (x, i) { return '<tr data-hi="' + i + '"><td>' + E(x.key) + '</td><td>' + hInp('value', x.value, 170) + '</td><td class="sd" style="font-size:12px;min-width:260px">' + E(x.note || '') + '</td><td class="sd" style="font-size:12px">' + E(x.status) + '</td><td><button class="btn sm" data-hsave="settings">儲存</button></td></tr>'; }).join('') + '</table></div>';
  watch($('sp'), { redraw: vHealth });
}
document.addEventListener('click', function (e) {
  var t = e.target, b;
  if ((b = t.closest('[data-htab]'))) { if (!guard()) return; htab = b.getAttribute('data-htab'); vHealth(); return; }
  if ((b = t.closest('[data-hup]'))) { var inp = b.parentNode.querySelector('input[data-f=image]'); pickFiles(false, b.getAttribute('data-hup'), function (u) { if (u[0]) setVal(inp, u[0]); }); return; }
  if ((b = t.closest('[data-hsave]'))) {
    var tr = b.closest('tr'), kind = b.getAttribute('data-hsave'), i = Number(tr.getAttribute('data-hi')), ls = labelsIn(tr), o = hRow(tr), H = cache.h, req, nm;
    if (!ls.length) { toast('這一列沒有修改'); return; }
    if (kind === 'items') { if (H.items[i]) { o.id = H.items[i].id; o.name = H.items[i].name; } nm = o.size + ' ' + o.main; req = call('adminSaveHealthItem', { item: o }); }
    else if (kind === 'addons') { if (H.addons[i]) o.id = H.addons[i].id; nm = o.name; req = call('adminSaveAddon', { item: o }); }
    else if (kind === 'veg') { nm = o.start + ' 這週'; req = call('adminSaveVeg', { veg: o }); }
    else { nm = H.settings[i].key; req = call('adminSaveHealthSetting', { key: H.settings[i].key, value: o.value }); }
    req.then(function () { toast('已儲存「' + nm + '」' + (ls.length ? '：' + ls.join('、') : '')); clearW(); vHealth(); }).catch(function (er) { toast(er.message); });
    return;
  }
  if ((b = t.closest('[data-hdel]'))) {
    var kd = b.getAttribute('data-hdel'), ix = Number(b.closest('tr').getAttribute('data-hi'));
    if (kd === 'items' && confirm('確定刪除「' + cache.h.items[ix].size + ' ' + cache.h.items[ix].main + '」？（只是暫時不賣的話，取消勾選「顯示」就好）')) call('adminDeleteHealthItem', { id: cache.h.items[ix].id }).then(function () { toast('已刪除'); clearW(); vHealth(); }).catch(function (er) { toast(er.message); });
    if (kd === 'addons' && confirm('確定刪除「' + cache.h.addons[ix].name + '」？（只是不想賣的話，取消勾選「顯示」就好）')) call('adminDeleteAddon', { id: cache.h.addons[ix].id }).then(function () { toast('已刪除'); clearW(); vHealth(); }).catch(function (er) { toast(er.message); });
    if (kd === 'veg' && confirm('確定刪除 ' + cache.h.veg[ix].start + ' 這週的蔬菜？')) call('adminDeleteVeg', { start: cache.h.veg[ix].start }).then(function () { toast('已刪除'); clearW(); vHealth(); }).catch(function (er) { toast(er.message); });
  }
});

/* ---------- 全域點擊 ---------- */
document.addEventListener('click', function (e) {
  var t = e.target, b;
  if ((b = t.closest('[data-view],[data-manage],[data-stab]')) && !guard()) return;
  if ((b = t.closest('[data-view]'))) { view = b.getAttribute('data-view'); drawTabs(); show(); return; }
  if ((b = t.closest('[data-manage]'))) { shopSel = b.getAttribute('data-manage'); view = 'shop'; stab = 'bookings'; drawTabs(); show(); return; }
  if ((b = t.closest('[data-stab]'))) { stab = b.getAttribute('data-stab'); vShop(true); return; }
  if ((b = t.closest('[data-bulk]'))) { var on = b.getAttribute('data-bulk') === '1'; Promise.all(me.shops.map(function (s) { return setOpen(s.id, on); })).then(function () { toast(on ? '已全部開放' : '已全部暫停'); vHome(); }); return; }
  if ((b = t.closest('[data-up-item]'))) {
    var card = b.closest('.icard'), hid = card.querySelector('[data-f=image]'), th = card.querySelector('.thumb');
    pickFiles(false, 'shop:' + shopSel, function (u) { if (u[0]) { th.classList.remove('broken'); th.src = u[0]; th.style.visibility = 'visible'; setVal(hid, u[0]); } }); return;
  }
  if ((b = t.closest('[data-isave]'))) { var ii = b.getAttribute('data-isave'), ib = labelsIn(b.closest('.icard')); if (!ib.length) { toast('這個項目沒有修改'); return; } var iname = itemOf(ii).name; call('adminSaveItem', { shopId: shopSel, item: itemOf(ii) }).then(function () { toast('已儲存「' + iname + '」：' + ib.join('、')); clearW(); vItems(getShop(shopSel)); }).catch(function (er) { toast(er.message); }); return; }
  if ((b = t.closest('[data-idel]'))) { var di = b.getAttribute('data-idel'); if (confirm('確定刪除這個項目？')) call('adminDeleteItem', { shopId: shopSel, id: cache.items[di].id }).then(function () { toast('已刪除'); vItems(getShop(shopSel)); }).catch(function (er) { toast(er.message); }); return; }
  if ((b = t.closest('[data-up-c]'))) { var ci = b.parentNode.querySelector('input'); pickFiles(false, 'content', function (u) { if (u[0]) setVal(ci, u[0]); }); return; }
  if ((b = t.closest('[data-up-row]'))) { var inp = b.parentNode.querySelector('input'); pickFiles(false, 'menu:' + hallSel, function (u) { if (u[0]) setVal(inp, u[0]); }); return; }
  if ((b = t.closest('[data-save]'))) { var mb = labelsIn(b.closest('tr')); if (!mb.length) { toast('這一列沒有修改'); return; } var mn = rowItem(b.getAttribute('data-save')).name; call('adminSaveMenu', { hall: hallSel, item: rowItem(b.getAttribute('data-save')) }).then(function () { toast('已儲存「' + mn + '」：' + mb.join('、')); clearW(); vMenu(getShop(shopSel)); }).catch(function (er) { toast(er.message); }); return; }
  if ((b = t.closest('[data-del]')) && confirm('確定刪除這個品項？')) call('adminDeleteMenu', { hall: hallSel, id: cache.menu[b.getAttribute('data-del')].id }).then(function () { toast('已刪除'); vMenu(getShop(shopSel)); }).catch(function (er) { toast(er.message); });
});
document.addEventListener('change', function (e) {
  var c = e.target.closest && e.target.closest('[data-open]'); if (!c) return;
  var on = c.checked; setOpen(c.getAttribute('data-open'), on).then(function () { toast(on ? '已開放預約' : '已暫停預約'); vHome(); }).catch(function () { c.checked = !on; });
});

/* ---------- 網站內容 ---------- */
var SUGGEST = [['首頁', '品牌', '標語'], ['首頁', '品牌', '品牌故事'], ['首頁', '圖片', '主圖'], ['漢口總店', '基本資料', '簡介'], ['漢口總店', '基本資料', '營業時間'], ['漢口總店', '基本資料', '電話'], ['漢口總店', '基本資料', '地址'], ['漢口總店', '基本資料', '交通'], ['漢口總店', '圖片', '封面'],
  ['黃埔二店', '基本資料', '簡介'], ['黃埔二店', '基本資料', '空間介紹'], ['黃埔二店', '基本資料', '營業時間'], ['黃埔二店', '基本資料', '電話'], ['黃埔二店', '基本資料', '地址'], ['黃埔二店', '基本資料', '交通'], ['黃埔二店', '圖片', '封面'], ['黃埔二店', '圖片', '相片1'], ['黃埔二店', '圖片', '相片2'], ['黃埔二店', '圖片', '相片3'],
  ['全站', '社群', 'Facebook'], ['全站', '社群', 'Instagram'], ['全站', '合作', '合作說明']];
function vContent() {
  call('adminContentList').then(function (rows) {
    var have = {}; rows.forEach(function (r) { have[r.page + '|' + r.field] = 1; });
    SUGGEST.forEach(function (s) { if (!have[s[0] + '|' + s[2]]) rows.push({ page: s[0], block: s[1], field: s[2], text: '', image: '' }); });
    cache.content = rows;
    $('pg').innerHTML = '<p class="sd">留白或填「待補」的欄位，前台會顯示預設字樣。圖片請貼公開的 https 網址（例如 Google 雲端硬碟、Imgur 或自家圖床）。</p><div class="tw"><table><tr><th>頁面</th><th>欄位</th><th>文字</th><th>圖片網址</th></tr>' +
      rows.map(function (r, i) { return '<tr data-i="' + i + '"><td>' + E(r.page) + '</td><td>' + E(r.field) + '</td><td><textarea class="mini" style="width:340px;min-height:44px;font:inherit;font-size:13px" data-f="text" data-lb="' + E(r.page + '・' + r.field) + '">' + E(r.text) + '</textarea></td><td><img class="thumb s pvs" alt="" style="display:none"><input class="mini" style="width:170px" data-f="image" data-img="1" data-lb="' + E(r.page + '・' + r.field + '（圖片）') + '" value="' + E(r.image) + '"> <button type="button" class="btn sm" data-up-c="1" style="padding:4px 10px">上傳</button></td></tr>'; }).join('') +
      '</table></div><p><button class="btn" id="saveC">儲存全部</button></p>';
    $('saveC').onclick = saveC;
    function saveC() {
      if (!W.n) { toast('沒有任何修改'); return; }
      var cmsg = W.n + ' 處修改已儲存';
      var out = cache.content.map(function (r, i) {
        var tr = document.querySelector('tr[data-i="' + i + '"]');
        return { page: r.page, block: r.block, field: r.field, text: tr.querySelector('[data-f=text]').value, image: tr.querySelector('[data-f=image]').value, _changed: tr.querySelector('[data-f=text]').value !== (r.text || '') || tr.querySelector('[data-f=image]').value !== (r.image || '') };
      }).filter(function (r) { return r._changed; });
      if (!out.length) { toast('沒有變更'); return; }
      var names = out.map(function (r) { return r.page + '・' + r.field; });
      call('adminSaveContent', { rows: out }).then(function () { toast('已儲存 ' + out.length + ' 筆：' + trunc(names.join('、'), 60)); clearW(); vContent(); }).catch(function (er) { toast(er.message); });
    }
    watch($('pg'), { save: saveC, label: '儲存全部', redraw: vContent });
  }).catch(err);
}

/* ---------- 合作洽談 ---------- */
function vInq() {
  call('adminInquiries').then(function (rows) {
    $('pg').innerHTML = rows.length ? '<div class="tw"><table><tr><th>時間</th><th>類型</th><th>單位 / 聯絡人</th><th>聯絡方式</th><th>內容</th><th>狀態</th></tr>' + rows.map(function (r) {
      return '<tr><td>' + E(r.time) + '</td><td>' + E(r.type) + '</td><td>' + E(r.org) + '<br>' + E(r.name) + '</td><td>' + E(r.phone) + '<br>' + E(r.email) + '</td><td style="max-width:360px;white-space:pre-wrap">' + E(r.message) + '</td><td><select class="st" data-row="' + r.row + '">' + ['新', '處理中', '已回覆', '結案'].map(function (s) { return '<option' + (s === r.status ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></td></tr>';
    }).join('') + '</table></div>' : '<div class="skel">目前沒有洽談資料。</div>';
    document.querySelectorAll('select[data-row]').forEach(function (s) { s.onchange = function () { call('adminSetInquiryStatus', { row: s.getAttribute('data-row'), status: s.value }).then(function () { toast('已更新'); }); }; });
  }).catch(err);
}

if (tok) start(); else { $('login').style.display = 'block'; drawBtn(); }
