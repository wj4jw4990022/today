<script>
Z.init('hankou', function (d) {
  var shops = d.shops.filter(function (s) { return s.hall === '漢口總店'; }), order = [], by = {};
  shops.forEach(function (s) { var f = String(s.floor).split(' ')[0]; if (!by[f]) { by[f] = []; order.push(f); } by[f].push(s); });
  order.sort(function (a, b) { return parseInt(a, 10) - parseInt(b, 10); });
  document.getElementById('count').textContent = Z.t('漢口總店|說明', '一棟樓，{n} 間店。由一樓往上逛，每一層都有不同的日子。').replace('{n}', shops.length);
  document.getElementById('floors').innerHTML = order.map(function (f) {
    return '<section class="fx" id="fl-' + Z.esc(f) + '"><div class="la"><div class="fl">' + Z.esc(f) + '</div></div><div class="cards">' + by[f].map(Z.card).join('') + '</div></section>';
  }).join('');
  var nav = order.map(function (f, i) { return '<a href="#fl-' + Z.esc(f) + '" data-f="' + Z.esc(f) + '"' + (i === 0 ? ' class="on"' : '') + '>' + Z.esc(f) + '</a>'; }).join('');
  document.getElementById('ele').innerHTML = '<div class="t">Floor</div>' + nav;
  document.getElementById('fbar').innerHTML = '<span class="t">Floor</span>' + nav;
  document.querySelectorAll('.ele a,.fbar a').forEach(function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); var t = document.getElementById('fl-' + a.getAttribute('data-f')); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  });
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (en) { if (en.isIntersecting) { var f = en.target.id.slice(3); document.querySelectorAll('.ele a,.fbar a').forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-f') === f); }); } });
    }, { rootMargin: '-35% 0px -55% 0px' });
    document.querySelectorAll('.fx').forEach(function (el) { io.observe(el); });
  }
});
</script>
