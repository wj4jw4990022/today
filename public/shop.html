<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>店家介紹｜致日子 漢口總店</title>
<meta name="description" content="致日子：高雄的複合式餐館。漢口總店一棟樓八間店，黃埔二店日式質感空間。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400;1,500&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400;1,500&display=swap"></noscript>
<meta property="og:type" content="website"><meta property="og:site_name" content="致日子 TO DAY Coffee"><meta property="og:title" content="店家介紹｜致日子 漢口總店"><meta property="og:description" content="致日子：高雄的複合式餐館。漢口總店一棟樓八間店，黃埔二店日式質感空間。"><meta property="og:image" content="https://aged-surf-919d.wj4wj4990022.workers.dev/assets/og.png"><meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="assets/favicon.png"><link rel="apple-touch-icon" href="assets/favicon.png">
<meta name="theme-color" content="#1D3D34">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/hankou.css">
<link rel="stylesheet" href="assets/shop.css">
</head>
<body class="hk hkx">
<div class="ev-wall"><div class="ev-beam"></div><div class="ev-beam b2"></div><div id="nav"></div></div>
<div class="sp-arr"><div class="crumb" data-r="1"><a href="hankou.html" data-c="店家頁|麵包屑">漢口總店</a>　／　<span id="cf"></span></div><div class="mid" data-r="2"><div class="ev-lv" id="alv"></div><div class="t" id="at"></div></div><div class="sp-fm" id="abtn"></div></div>
<main id="main">
 <section class="ev-wall sp-hero"><div class="ev-beam b2"></div>
  <div data-r="6" id="pic"></div>
  <div>
   <div data-r="2"><span class="ev-caps" id="cap"></span><h1 class="sp-nm" id="nm"></h1></div>
   <div data-r="3"><div class="sp-tg" id="tags"></div><div class="sp-now" id="now"></div></div>
   <div data-r="4"><p class="sp-line" id="line"></p><p class="sp-intro" id="intro"></p></div>
   <div data-r="5"><div class="sp-cta" id="cta"></div><div class="sp-soc" id="soc"></div></div>
  </div>
 </section>
 <div class="sp-info" id="info"></div>
 <section class="ev-wall sp-sec" id="isec" data-r="7" style="display:none"><div class="ev-beam b2"></div><div class="sp-sh"><div><div class="en" data-c="店家頁|項目英文">Menu &amp; Service</div><h2 id="ititle"></h2></div><div class="sp-cats" id="cats"></div></div><div class="sp-mn" id="items"></div></section>
 <section class="ev-wall sp-sec" id="gsec" data-r="8" style="display:none"><div class="ev-beam"></div><div class="sp-sh"><div><div class="en" data-c="店家頁|相簿英文">Gallery</div><h2 data-c="店家頁|相簿標題">店內一隅</h2></div><span class="cap" data-c="店家頁|相簿提示">點照片放大</span></div><div class="sp-gal" id="gal"></div></section>
 <section class="ev-wall sp-sec" data-r="9"><div class="ev-beam b2"></div><div class="sp-sh"><div><div class="en" data-c="店家頁|同棟英文">Same Building</div><h2 data-c="店家頁|同棟標題">漢口總店的其他店家</h2></div></div><div class="sp-nb" id="nb"></div></section>
 <section class="ev-wall sp-end" id="end" data-r="5"><div class="ev-beam"></div><span class="ev-caps" data-c="店家頁|結尾英文">Reservation</span><div class="h" data-c="店家頁|結尾標題">今天想來坐坐嗎？</div><div id="endbtn"></div></section>
</main>
<div id="foot"></div>
<script src="assets/config.js"></script>
<script src="assets/demo-data.js"></script>
<script src="assets/app.js"></script>
<script>
var id = new URLSearchParams(location.search).get('id') || '';
if (id === 'p') location.replace('huangpu.html');
(function () {
  var E = Z.esc, reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var WD = ['日', '一', '二', '三', '四', '五', '六'];
  function el(x) { return document.getElementById(x); }
  function fl0(s) { return String(s.floor).split(' ')[0]; }
  function num(f) { return String(f).replace(/F$/i, ''); }
  var DEF = { '1F': '咖啡與選物', '2F': '髮型與刺青', '3F': '靈石、推拿與空間', '4F': '婚紗攝影・租借' };
  function ftitle(f) { return Z.t('漢口總店|' + f + '標題', DEF[f] || f); }
  function hh(t) { var a = String(t).split(':'); return a[1] === '00' ? a[0] : t; }
  function door(s, arch, cls) {
    var u = Z.safeUrl(s.image);
    return '<a class="ev-door' + (cls || '') + '" href="shop.html?id=' + encodeURIComponent(s.id) + '" aria-label="' + E(s.name) + '"><span class="ev-arch">' + arch + '</span><div class="ev-in"><div class="ev-pic">' +
      (u ? '<img src="' + E(u) + '" alt="' + E(s.name) + '">' : '<div class="ev-beam"></div>') + '</div><div class="ev-dl"></div><div class="ev-dr"></div></div></a>';
  }
  function no2(i) { return (i < 9 ? '0' : '') + (i + 1); }

  Z.init('shop', function (d) {
    var shop = d.shops.filter(function (s) { return s.id === id && s.hall === '漢口總店'; })[0];
    if (!shop) { if (!Z.edit) Z.fail(el('main'), '找不到這間店。'); return; } // 後台預覽：新店還沒公開時，等後台傳來資料再畫
    var hall = d.shops.filter(function (s) { return s.hall === '漢口總店'; }), f = fl0(shop), sub = String(shop.floor).split(' ')[1] || '';
    var same = hall.filter(function (s) { return fl0(s) === f; }), idx = same.indexOf(shop);
    var floors = []; hall.forEach(function (s) { var g = fl0(s); if (floors.indexOf(g) < 0) floors.push(g); });
    floors.sort(function (a, b) { return parseInt(a, 10) - parseInt(b, 10); });
    document.title = shop.name + '｜致日子 漢口總店';

    /* 到站列 */
    el('cf').textContent = shop.floor + '　' + shop.name;
    el('alv').innerHTML = E(num(f)) + '<small>F</small>';
    el('at').innerHTML = '<b>' + E(ftitle(f)) + '</b>這一層 ' + same.length + ' 間' + (same.length > 1 ? '　·　' + no2(idx) + ' / ' + no2(same.length - 1) : '');
    el('abtn').innerHTML = floors.map(function (g) { return '<a class="ev-b' + (g === f ? ' on' : '') + '" href="hankou.html#fl-' + E(g) + '" aria-label="前往 ' + E(g) + '">' + E(num(g)) + '</a>'; }).join('');

    /* 主圖（電梯門）與店名 */
    el('pic').innerHTML = door(shop, '<b>' + E(f) + '</b>' + (same.length > 1 ? '<span>·</span><span>' + no2(idx) + '</span>' : ''), reduce || Z.edit ? ' op' : '');
    if (!reduce && !Z.edit) setTimeout(function () { var x = el('pic').querySelector('.ev-door'); if (x) x.classList.add('op'); }, 350);
    el('cap').textContent = f + (sub ? ' ' + sub : '') + '　·　' + ftitle(f);
    el('nm').textContent = shop.name;
    el('tags').innerHTML = [sub, Z.isPlaceholder(shop.type) ? '' : shop.type].filter(Boolean).map(function (t) { return '<span>' + E(t) + '</span>'; }).join('');
    var hs = Z.hoursState(shop), closed = (shop.closed || []).map(function (n) { return '週' + WD[n]; }).join('、');
    el('now').innerHTML = hs ? '<span class="ev-dot ' + hs.state + '"></span>' + E(hs.text) + (closed ? '<span class="off">　·　' + E(closed) + '公休</span>' : '') :
      (Z.isPlaceholder(shop.hours) ? '' : '<span class="off">' + E(shop.hours) + '</span>');
    var line = Z.isPlaceholder(shop.tagline) ? '' : (shop.tagline || '');
    el('line').textContent = line; el('line').style.display = line ? '' : 'none';
    el('intro').textContent = Z.isPlaceholder(shop.intro) ? '[店家介紹]' : shop.intro;

    var c = shop.contact || {}, tel = c.phone ? String(c.phone).replace(/[^0-9+#]/g, '') : '';
    var mb = Z.mainBtn(shop, 'sp-g');
    el('cta').innerHTML = mb + (shop.id === 'h1' ? '<a class="ev-ghost" href="hankou-menu.html">' + Z.ct('店家頁|看餐點按鈕', '看餐點') + '</a>' : '') + '<a class="ev-ghost" href="hankou.html#fl-' + E(f) + '">' + Z.ct('店家頁|回漢口按鈕', '回漢口總店') + '</a>';
    el('soc').innerHTML = (tel && c.btnMode !== 'tel' ? '<a href="tel:' + E(tel) + '">☎ ' + E(c.phone) + '</a>' : '') + Z.social(shop);

    /* 資訊列：一週營業時間、位置、聯絡 */
    var info = '';
    if (shop.hoursStart && shop.hoursEnd) {
      var today = Z.nowTpe().wd;
      info += '<div data-r="3"><span class="ev-caps">Hours　營業時間</span><div class="sp-wk">' + [1, 2, 3, 4, 5, 6, 0].map(function (n) {
        var off = (shop.closed || []).indexOf(n) >= 0;
        return '<div class="' + (off ? 'off' : '') + (n === today ? ' td' : '') + '"><b>' + WD[n] + '</b>' + (off ? '公休' : E(hh(shop.hoursStart)) + '–' + E(hh(shop.hoursEnd))) + '</div>';
      }).join('') + '</div></div>';
    } else if (!Z.isPlaceholder(shop.hours)) info += '<div data-r="3"><span class="ev-caps">Hours　營業時間</span><p>' + E(shop.hours) + '</p></div>';
    var map = Z.safeUrl(Z.t('漢口總店|地圖連結', ''));
    info += '<div><span class="ev-caps">Location　位置</span><p>' + E(Z.t('漢口總店|地址', '高雄市三民區漢口街 200 號')) + '<br>' + E(shop.floor) + '</p>' + (map ? '<a class="go" href="' + E(map) + '" target="_blank" rel="noopener">Google 地圖 →</a>' : '') + '</div>';
    if (tel || Z.social(shop)) info += '<div data-r="5"><span class="ev-caps">Contact　聯絡</span><p>' + (c.phone ? E(c.phone) : '') + '</p>' + (tel ? '<a class="go" href="tel:' + E(tel) + '">撥打電話 →</a>' : '') + '</div>';
    el('info').innerHTML = info;
    var nH = /data-r="3"/.test(info) ? 1 : 0, nAll = (info.match(/<div( data-r="\d")?><span class="ev-caps">/g) || []).length;
    el('info').style.setProperty('--cols', (nH ? '1.6fr ' : '') + Array(nAll - nH + 1).join('1fr ').trim());

    /* 服務項目：兩種以上分類時可切換 */
    var its = shop.items || [];
    el('isec').style.display = its.length ? 'block' : 'none';
    if (its.length) {
      el('ititle').textContent = shop.itemsTitle || '服務項目';
      var cats = []; its.forEach(function (i) { if (i.cat && cats.indexOf(i.cat) < 0) cats.push(i.cat); });
      el('cats').innerHTML = cats.length > 1 ? '<button type="button" class="on" data-cat="">全部</button>' + cats.map(function (x) { return '<button type="button" data-cat="' + E(x) + '">' + E(x) + '</button>'; }).join('') : '';
      var pics = its.some(function (i) { return Z.safeUrl(i.image); });
      el('items').innerHTML = its.map(function (i) {
        var u = Z.safeUrl(i.image);
        return '<div class="sp-mi" data-cat="' + E(i.cat || '') + '">' + (pics ? '<div class="th">' + (u ? '<img src="' + E(u) + '" alt="' + E(i.name) + '" loading="lazy">' : '') + '</div>' : '') +
          '<div class="x"><b>' + E(i.name) + '</b>' + (Z.isPlaceholder(i.desc) || !i.desc ? '' : '<span>' + E(i.desc) + '</span>') + '</div>' + (i.price ? '<div class="pr">' + E(i.price) + '</div>' : '') + '</div>';
      }).join('');
    }

    /* 相簿 */
    var g = (shop.gallery || []).filter(Z.safeUrl);
    el('gsec').style.display = g.length ? 'block' : 'none';
    el('gal').innerHTML = g.map(function (u) { return '<a href="' + E(u) + '" data-lb="1"><img src="' + E(u) + '" alt="' + E(shop.name) + '" loading="lazy"></a>'; }).join('');

    /* 同一層的其他店（電梯門）＋其他樓層（電梯按鈕） */
    var others = same.filter(function (s) { return s !== shop; });
    var nb = '';
    if (others.length) nb += '<div><h3>' + Z.ct('店家頁|同層標題', '同一層') + '</h3><div class="same">' + others.map(function (s) {
      var j = same.indexOf(s), h2 = Z.hoursState(s), ty = [String(s.floor).split(' ')[1] || '', Z.isPlaceholder(s.type) ? '' : s.type, h2 ? h2.text : ''].filter(Boolean).join(' · ');
      return '<div>' + door(s, '<b>' + E(f) + '</b><span>·</span><span>' + no2(j) + '</span>', ' op') +
        '<div class="ev-shop"><span class="ev-dot ' + (h2 ? h2.state : '') + '"></span><div class="x"><a class="nm" href="shop.html?id=' + encodeURIComponent(s.id) + '">' + E(s.name) + '</a>' + (ty ? '<div class="ty">' + E(ty) + '</div>' : '') + '</div><div class="acts"><a href="shop.html?id=' + encodeURIComponent(s.id) + '">' + Z.ct('漢口總店|卡片看介紹', '看介紹') + ' →</a></div></div></div>';
    }).join('') + '</div></div>';
    nb += '<div><h3>' + Z.ct('店家頁|其他樓層標題', '其他樓層') + '</h3><div class="sp-lift">' + floors.filter(function (x) { return x !== f; }).map(function (x) {
      var ss = hall.filter(function (s) { return fl0(s) === x; });
      return '<a class="sp-fl" href="hankou.html#fl-' + E(x) + '"><span class="ev-b">' + E(num(x)) + '</span><span class="t"><small>' + E(ftitle(x)) + '</small>' + ss.map(function (s) { return E(s.name); }).join('　·　') + '</span><span class="go">→</span></a>';
    }).join('') + '</div></div>';
    el('nb').className = 'sp-nb' + (others.length ? '' : ' solo'); el('nb').innerHTML = nb;

    /* 結尾預約 */
    var eb = Z.mainBtn(shop, 'sp-g');
    el('end').style.display = eb && c.btnMode !== 'none' ? '' : 'none';
    el('endbtn').innerHTML = eb;

    /* 手機底部預約列 */
    var ob = document.querySelector('.sbar'); if (ob) ob.remove(); document.body.classList.remove('hasbar');
    var sb = Z.mainBtn(shop, 'btn sm'); if (sb && c.btnMode !== 'none' && (shop.open || c.btnMode === 'tel')) { document.body.classList.add('hasbar'); document.body.insertAdjacentHTML('beforeend', '<div class="sbar"><span class="sn">' + E(shop.name) + '</span>' + sb + '</div>'); }
  });

  /* 分類切換、相簿放大（只綁一次） */
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('#cats [data-cat]');
    if (b) {
      var k = b.getAttribute('data-cat');
      document.querySelectorAll('#cats button').forEach(function (x) { x.classList.toggle('on', x === b); });
      document.querySelectorAll('#items .sp-mi').forEach(function (m) { m.hidden = !!k && m.getAttribute('data-cat') !== k; });
      return;
    }
    var a = e.target.closest && e.target.closest('#gal [data-lb]'); if (!a || Z.edit) return;
    e.preventDefault();
    var o = document.createElement('div'); o.className = 'lb'; o.innerHTML = '<img src="' + E(a.getAttribute('href')) + '" alt="">';
    o.onclick = function () { o.remove(); }; document.body.appendChild(o);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { var o = document.querySelector('.lb'); if (o) o.remove(); } });
})();
</script>
</body>
</html>
