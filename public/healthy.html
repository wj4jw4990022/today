<!doctype html>
<html lang="zh-Hant">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap"></noscript>
<meta property="og:type" content="website"><meta property="og:site_name" content="致日子 TO DAY Coffee"><meta property="og:title" content="健康餐｜致日子"><meta property="og:description" content="三種份量、三種主菜，營養標示完整。"><meta property="og:image" content="https://aged-surf-919d.wj4wj4990022.workers.dev/assets/og.png">

<body class="hk hx">
<div class="hb-dk"><div id="nav"></div><header id="hhero"></header></div>
<main id="main"><div id="hx"><div class="skel" style="padding:80px 56px">載入中…</div></div></main>
<div id="foot"></div>
<div class="hb-sbar" id="sbar" style="display:none"></div>
<script src="assets/config.js"></script>
<script src="assets/demo-data.js"></script>
<script src="assets/app.js"></script>
<script>
/* 健康餐頁（版面 B）。價格、營養、方案來自後台「健康餐」；頁面文字來自「頁面內容 › 健康餐頁」。
   會員系統上線前，訂閱相關按鈕都顯示「即將開放」且不能點（由健康餐設定「會員系統開放」決定）。 */
var E = Z.esc, MEMBER_OPEN = false, ORDER = ['LIGHT', 'BALANCE', 'POWER'];
var COL = { '紅': '#C9483A', '黃': '#E0B33A', '綠': '#3F7A4F', '橙': '#D9822B', '紫': '#7A4A8A', '白': '#D8D8CC', '棕': '#8A5A3B' };
var M = null, sel = '';
function so(s) { var i = ORDER.indexOf(s); return i < 0 ? 99 : i; }
function money(n) { return Number(n).toLocaleString('en-US'); }
function mmdd(s) { var p = s.split('-'); return Number(p[1]) + '/' + Number(p[2]); }
function weekRange(s) { var d = new Date(s + 'T12:00:00'), e = new Date(d.getTime() + 6 * 86400000); return mmdd(s) + ' – ' + (e.getMonth() + 1) + '/' + e.getDate(); }
function img(url, fallback, alt) { var u = Z.safeUrl(url) || fallback; return u ? '<img src="' + E(u) + '" alt="' + E(alt) + '" loading="lazy">' : '<div class="tg">照片準備中</div>'; }
function sh(en, key, def, right) { return '<div class="hb-sh"><div><div class="hb-en">' + en + '</div><h2>' + Z.ct(key, def) + '</h2></div>' + (right || '') + '</div>'; }
function soon(key, def) { return '<span class="hb-btn off">' + Z.ct(key, def) + '</span>'; }

function sizeCards() {
  var list = M.items.filter(function (i) { return i.main === sel; }).sort(function (a, b) { return so(a.size) - so(b.size); });
  return list.map(function (i) {
    var pct = i.kcal ? Math.round(i.protein * 4 / i.kcal * 100) : 0;
    return '<div class="hb-sz"><div class="hb-pic">' + img(i.image, 'assets/illus/bento.svg', i.name || (i.size + ' ' + i.main)) + '</div><div class="bd">' +
      '<div class="nm"><b>' + E(i.size) + '</b><span>' + E(i.main) + ' · 飯 ' + E(i.rice) + 'g</span></div>' + (i.name ? '<div class="ti">' + E(i.name) + '</div>' : '') +
      '<div class="hb-mac"><div><b>' + i.kcal + '</b>大卡</div><div><b>' + i.protein + 'g</b>蛋白質</div><div><b>' + i.carb + 'g</b>碳水</div><div><b>' + i.fat + 'g</b>脂肪</div></div>' +
      (pct ? '<div class="hb-bl"><span>蛋白質佔熱量</span><span>' + pct + '%</span></div><div class="hb-bar"><i style="width:' + Math.min(pct, 100) + '%"></i></div>' : '') +
      '<div class="ds">' + E(i.mainDesc || i.main) + '・黑米五穀飯 ' + E(i.rice) + 'g・溏心蛋 1 顆・蔬菜 ' + E(i.vegG) + 'g' + (i.desc ? '<br>' + E(i.desc) : '') + '</div>' +
      '<div class="pr"><div><b>' + money(i.price) + '</b><small>元／單點</small></div>' + (M.plans.length ? '<div class="sub">訂閱升級<br>' + (i.upg ? '+' + money(i.upg) + ' 元／餐' : '基本餐，不加價') + '</div>' : '') + '</div>' +
      '<div class="act">' + (MEMBER_OPEN ? '<a href="order.html?item=' + encodeURIComponent(i.id) + '">訂這個 →</a>' : '<span>' + Z.ct('健康餐|單點按鈕', '線上單點即將開放') + '</span>') + '</div></div></div>';
  }).join('');
}

function hero(d, open) {
  var intro = Z.t('健康餐|介紹', ''), h = '<section class="hb-hero"><div><div class="hb-en">' + Z.ct('健康餐|英文', 'Healthy Box · 1F 致日子咖啡') + '</div><h1>' + Z.ct('健康餐|標題', '致日子健康餐') + '</h1>';
  if (!open) return h + '<p>' + Z.ct('健康餐|未開放提示', '健康餐即將推出，敬請期待。') + '</p></div>' + heroPic() + '</section>';
  var mains = uniq(d.items, 'main'), sizes = uniq(d.items, 'size').sort(function (a, b) { return so(a) - so(b); }), vegG = d.items[0].vegG;
  var minPer = d.plans.length ? Math.min.apply(null, d.plans.map(function (p) { return p.per; })) : 0;
  h += '<p>' + (intro ? Z.ct('健康餐|介紹', '') : '一套配方、' + sizes.length + ' 種份量。主菜可選' + E(mains.join('、')) + '，搭配黑米五穀飯、溏心蛋與蔬菜，每一盒都標示熱量、蛋白質、碳水與脂肪。') + '</p>' +
    '<div class="hb-stats" style="grid-template-columns:repeat(' + (minPer ? 4 : 3) + ',1fr)"><div><b>' + sizes.length + '</b><span>種份量</span></div><div><b>' + mains.length + '</b><span>種主菜</span></div><div><b>' + E(vegG) + 'g</b><span>每盒蔬菜</span></div>' + (minPer ? '<div><b>' + money(minPer) + '</b><span>訂閱每餐起</span></div>' : '') + '</div>' +
    '<div class="hb-ctas">' + (d.plans.length ? (MEMBER_OPEN ? '<a class="hb-btn g" href="member.html">' + Z.ct('健康餐|主按鈕', '加入會員・訂閱') + '</a>' : '<span class="hb-btn g off">' + Z.ct('健康餐|主按鈕', '加入會員・訂閱') + '<small>' + Z.ct('健康餐|訂閱按鈕', '即將開放') + '</small></span>') : '') +
    (MEMBER_OPEN ? '<a class="hb-btn" href="order.html">訂餐</a>' : '') + '<a class="hb-btn" href="#all">' + Z.ct('健康餐|次按鈕', '看菜單') + '</a></div>' +
    (Z.t('健康餐|頁首備註', '') ? '<div class="hb-cap">' + Z.ct('健康餐|頁首備註', '') + '</div>' : '') + '</div>' + heroPic() + '</section>';
  return h;
}
function heroPic() { return '<div class="hb-pic hb-main" data-ci="健康餐|主圖"><img src="assets/illus/bento-wide.svg" alt="健康餐（示意）"></div>'; }
function uniq(a, k) { var o = []; a.forEach(function (x) { if (o.indexOf(x[k]) < 0) o.push(x[k]); }); return o; }

function draw(d) {
  M = d; MEMBER_OPEN = !!(d && d.memberOpen); var top = document.getElementById('hhero'), h = document.getElementById('hx'), sb = document.getElementById('sbar');
  var open = d && d.open && d.items && d.items.length;
  top.innerHTML = (d && d.preview ? '<div style="background:#8A5E2E;color:#FBF8F1;text-align:center;font-size:12px;letter-spacing:.14em;padding:6px">後台預覽：健康餐頁面尚未對外開放，一般訪客只會看到「即將推出」</div>' : '') + hero(d || {}, open);
  if (!open) { h.innerHTML = ''; sb.style.display = 'none'; document.body.classList.remove('sb'); return; }
  var mains = uniq(d.items, 'main'), sizes = uniq(d.items, 'size').sort(function (a, b) { return so(a) - so(b); });
  if (mains.indexOf(sel) < 0) sel = mains[0];
  var v = d.veg, vegG = d.items[0].vegG, vn = v ? v.fixed.length + v.rotating.length : 0, riceBy = {};
  d.items.forEach(function (i) { riceBy[i.size] = i.rice; });
  var sauces = d.addons.filter(function (a) { return a.type === '醬汁'; }), drinks = d.addons.filter(function (a) { return a.type === '飲品'; });
  var freeS = sauces.filter(function (a) { return a.free; }), paidS = sauces.filter(function (a) { return !a.free && a.price !== null; });
  var allergen = ['蛋（溏心蛋）'].concat(sauces.filter(function (a) { return a.desc && /含/.test(a.desc); }).map(function (a) { return a.name + a.desc; }));
  var minPer = d.plans.length ? Math.min.apply(null, d.plans.map(function (p) { return p.per; })) : 0;
  var x = '';

  // 菜單
  x += '<section class="hb-sec" id="menu">' + sh('Menu', '健康餐|菜單標題', '選主菜，看三種份量', mains.length > 1 ? '<div class="hb-tabs" id="mains">' + mains.map(function (m) { return '<button type="button" class="' + (m === sel ? 'on' : '') + '" data-m="' + E(m) + '">' + E(m) + '</button>'; }).join('') + '</div>' : '') +
    '<div class="hb-sizes" id="sizes">' + sizeCards() + '</div><div class="hb-note">營養標示不含醬汁與加購飲品。' + (v && v.rotating.length ? '輪替蔬菜每週不同，數字為平均估算值。' : '') + '過敏原：' + E(allergen.join('；')) + '。完整過敏原資訊請洽店員。</div></section>';

  // 全部便當（可篩選；按「訂這個」進入訂餐畫面）
  x += '<section class="hb-sec" id="all">' + sh('All Boxes', '健康餐|全部標題', '全部便當') +
    '<div class="hb-flt"><b>主菜</b>' + ['全部'].concat(mains).map(function (m) { return '<button type="button" data-gm="' + E(m) + '" class="' + (m === GF.m ? 'on' : '') + '">' + E(m) + '</button>'; }).join('') + '</div>' +
    '<div class="hb-flt"><b>份量</b>' + ['全部'].concat(sizes).map(function (m) { return '<button type="button" data-gs="' + E(m) + '" class="' + (m === GF.s ? 'on' : '') + '">' + E(m) + '</button>'; }).join('') + '</div>' +
    '<div class="hb-gal" id="gal">' + galCards() + '</div></section>';

  // 每一盒都有
  x += '<section class="hb-sec">' + sh('Every Box', '健康餐|每盒標題', '每一盒都有') + '<div class="hb-inc">' +
    '<div><div class="t">主食</div><div class="v">黑米五穀飯</div><p>' + sizes.map(function (s) { return E(s) + ' ' + E(riceBy[s]) + 'g'; }).join('<br>') + '</p></div>' +
    '<div><div class="t">蛋</div><div class="v">溏心蛋 1 顆</div><p>每盒固定附一顆。</p></div>' +
    '<div><div class="t">蔬菜</div><div class="v">' + (vn ? vn + ' 種・' : '') + E(vegG) + 'g</div><p>' + (v ? '固定 ' + v.fixed.length + ' 種' + (v.rotating.length ? '，另外 ' + v.rotating.length + ' 種每週依市場採購輪替' : '') : '依當週市場採購') + '。</p></div>' +
    '<div><div class="t">醬汁</div><div class="v">' + (freeS.length > 1 ? '免費 ' + freeS.length + ' 選 1' : freeS.length ? '免費附贈' : '另附醬汁') + '</div><p>' + E(freeS.map(function (a) { return a.name; }).join('、')) + (freeS.length ? '。' : '') + paidS.map(function (a) { return E(a.name) + '另加 ' + a.price + ' 元'; }).join('；') + (paidS.length ? '。' : '') + '</p></div></div></section>';

  // 本週蔬菜
  if (v) x += '<section class="hb-sec">' + sh('This Week', '健康餐|蔬菜標題', '本週蔬菜', '<span class="hb-cap">' + weekRange(v.weekStart) + '</span>') + '<div class="hb-veg" style="--n:' + Math.min(vn, 6) + '">' +
    v.fixed.map(function (y) { return vegCell(y, '固定' + (y.grams ? ' ' + y.grams + 'g' : ''), ''); }).join('') + v.rotating.map(function (y) { return vegCell(y, '本週輪替' + (y.grams ? ' ' + y.grams + 'g' : ''), 'rt'); }).join('') + '</div></section>';

  // 加購飲品
  if (drinks.length) x += '<section class="hb-sec">' + sh('Add-ons', '健康餐|飲品標題', '加購飲品') + '<div class="hb-drinks">' + drinks.map(function (a) {
    return '<div class="hb-dr"><div class="hb-pic">' + img(a.image, '', a.name) + '</div><div><div class="h">' + E(a.name) + '</div>' + (a.protein ? '<div class="hb-cap" style="margin-top:6px">蛋白質約 ' + a.protein + 'g</div>' : '') + (a.desc ? '<div class="d">' + E(a.desc) + '</div>' : '') + '<div class="pr">' + (a.price === null ? '—' : '+' + money(a.price)) + '</div></div></div>';
  }).join('') + '</div></section>';

  // 月訂閱方案
  if (d.plans.length) {
    var up = []; sizes.forEach(function (s) { if (d.upgrade.size[s]) up.push(s + ' +' + d.upgrade.size[s]); }); mains.forEach(function (m) { if (d.upgrade.main[m]) up.push('換' + m + ' +' + d.upgrade.main[m]); });
    var base = d.items.filter(function (i) { return !i.upg; })[0], rf = d.referral || {}, rfs = d.plans.map(function (p) { return rf[p.meals] || 0; });
    x += '<section class="hb-sec alt" id="plans">' + sh('Subscription', '健康餐|方案標題', '月訂閱方案', '<span class="hb-cap">' + d.days + ' 天一期・預約制・會員專屬</span>') + '<div class="hb-plans" style="--n:' + d.plans.length + '">' +
      d.plans.map(function (p) {
        var low = p.per === minPer && d.plans.length > 1;
        return '<div class="hb-pl' + (low ? ' hot' : '') + '">' + (low ? '<div class="flag">每餐最低</div>' : '') + '<div class="n">' + p.meals + '<small>餐</small></div><div class="big">' + money(p.total) + '<small> 元</small></div><div class="hb-cap">每餐 ' + money(p.per) + ' 元</div>' +
          '<ul><li>中午、晚上皆可預約</li><li>門市自取或固定配送點</li><li>每期可暫停 ' + d.pause.times + ' 次、最多 ' + d.pause.days + ' 天</li></ul>' +
          (MEMBER_OPEN ? '<a class="hb-btn' + (low ? ' g' : '') + '" href="member.html?plan=' + p.meals + '">選擇 ' + p.meals + ' 餐</a>' : '<span class="hb-btn off' + (low ? ' g' : '') + '">' + Z.ct('健康餐|訂閱按鈕', '即將開放') + '</span>') + '</div>';
      }).join('') + '</div>' +
      (up.length ? '<div class="hb-upg"><b>方案以 ' + E(base ? base.size + ' ' + base.main : '基本餐') + ' 計價，升級每餐另加：</b>' + up.map(function (u) { return '<span>' + E(u) + '</span>'; }).join('') + '</div>' : '') +
      (rfs.some(Boolean) ? '<div class="hb-note">用朋友推薦碼第一次訂閱，可得紅利 ' + rfs.map(money).join('／') + ' 元（' + d.plans.map(function (p) { return p.meals; }).join('／') + ' 餐，紅利只能消費）。</div>' : '') +
      (Z.t('健康餐|訂閱備註', '') ? '<div class="hb-note">' + Z.ct('健康餐|訂閱備註', '') + '</div>' : '') + '</section>';
  }

  // 怎麼訂
  var steps = [1, 2, 3, 4].filter(function (n) { return Z.t('健康餐|步驟' + n + '標題', ''); });
  if (Z.t('健康餐|步驟標題', '') && steps.length) x += '<section class="hb-sec">' + sh(Z.ct('健康餐|步驟英文', 'How it works'), '健康餐|步驟標題', '怎麼訂') + '<div class="hb-how" style="--n:' + steps.length + '">' +
    steps.map(function (n, i) { return '<div><b>0' + (i + 1) + '</b><h3>' + Z.ct('健康餐|步驟' + n + '標題', '') + '</h3><p>' + Z.ct('健康餐|步驟' + n + '說明', '') + '</p></div>'; }).join('') + '</div></section>';

  // 常見問題
  var qs = [1, 2, 3, 4, 5, 6].filter(function (n) { return Z.t('健康餐|問題' + n, ''); });
  if (Z.t('健康餐|問答標題', '') && qs.length) x += '<section class="hb-sec">' + sh(Z.ct('健康餐|問答英文', 'FAQ'), '健康餐|問答標題', '常見問題') + '<div class="hb-faq">' +
    qs.map(function (n, i) { return '<details' + (i ? '' : ' open') + '><summary>' + Z.ct('健康餐|問題' + n, '') + '</summary><p>' + Z.ct('健康餐|回答' + n, '') + '</p></details>'; }).join('') + '</div></section>';

  x += '<section class="hb-dk hb-end"><div class="hb-en">' + Z.ct('健康餐|橫幅英文', 'Contact') + '</div><div class="h">' + Z.ct('健康餐|橫幅標題', '想了解月訂閱或團體訂購？') + '</div><a class="hb-btn g" href="contact.html">' + Z.ct('健康餐|橫幅按鈕', '聯絡我們') + '</a></section>';
  h.innerHTML = x;

  if (d.plans.length) { sb.innerHTML = '<div class="t"><b>月訂閱 每餐 ' + money(minPer) + ' 元起</b>' + Z.ct('健康餐|手機列說明', '前一天 20:00 前預約') + '</div><a href="#plans">看方案</a>'; sb.style.display = ''; document.body.classList.add('sb'); }
  else { sb.style.display = 'none'; document.body.classList.remove('sb'); }
}
var GF = { m: '全部', s: '全部' };
function galCards() {
  var list = M.items.filter(function (i) { return (GF.m === '全部' || i.main === GF.m) && (GF.s === '全部' || i.size === GF.s); }).sort(function (a, b) { return so(a.size) - so(b.size) || String(a.main).localeCompare(String(b.main)); });
  if (!list.length) return '<p class="hb-note">沒有符合的便當</p>';
  return list.map(function (i) {
    return '<div class="hb-gc"><button type="button" class="hb-pic" data-gz="' + E(i.id) + '">' + img(i.image, 'assets/illus/bento.svg', i.name || (i.size + ' ' + i.main)) + '</button><div class="bd">' +
      '<div class="nm"><b>' + E(i.size) + '・' + E(i.main) + '</b><span>' + money(i.price) + '</span></div>' +
      '<div class="hb-mac"><div><b>' + i.kcal + '</b>大卡</div><div><b>' + i.protein + 'g</b>蛋白質</div><div><b>' + i.carb + 'g</b>碳水</div><div><b>' + i.fat + 'g</b>脂肪</div></div>' +
      (MEMBER_OPEN ? '<a class="hb-btn" href="order.html?item=' + encodeURIComponent(i.id) + '">訂這個</a>' : '<span class="hb-btn off">' + Z.ct('健康餐|單點按鈕', '線上單點即將開放') + '</span>') + '</div></div>';
  }).join('');
}
function zoom(id) {
  var i = M.items.filter(function (x) { return x.id === id; })[0]; if (!i) return;
  var d = document.createElement('div'); d.className = 'hb-zoom';
  d.innerHTML = '<div class="in"><div class="hb-pic">' + img(i.image, 'assets/illus/bento.svg', i.name) + '</div><div class="tx"><div class="hb-en">' + E(i.size) + '</div><h3>' + E(i.name || (i.size + ' ' + i.main)) + '</h3>' +
    '<div class="hb-mac"><div><b>' + i.kcal + '</b>大卡</div><div><b>' + i.protein + 'g</b>蛋白質</div><div><b>' + i.carb + 'g</b>碳水</div><div><b>' + i.fat + 'g</b>脂肪</div></div>' +
    '<p>' + E(i.mainDesc || i.main) + '・黑米五穀飯 ' + E(i.rice) + 'g・溏心蛋 1 顆・蔬菜 ' + E(i.vegG) + 'g' + (i.desc ? '<br>' + E(i.desc) : '') + '</p><p><b>' + money(i.price) + ' 元</b>／單點' + (i.upg ? '・訂閱 +' + money(i.upg) + ' 元' : '・訂閱基本餐') + '</p>' +
    (MEMBER_OPEN ? '<a class="hb-btn g" href="order.html?item=' + encodeURIComponent(i.id) + '">訂這個</a> ' : '') + '<button type="button" class="hb-btn" data-gx>關閉</button></div></div>';
  d.addEventListener('click', function (e) { if (e.target === d || e.target.hasAttribute('data-gx')) d.remove(); });
  document.body.appendChild(d);
}
document.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('[data-gm],[data-gs],[data-gz]'); if (!b || !M) return;
  if (b.hasAttribute('data-gz')) { zoom(b.getAttribute('data-gz')); return; }
  if (b.hasAttribute('data-gm')) GF.m = b.getAttribute('data-gm'); else GF.s = b.getAttribute('data-gs');
  document.querySelectorAll('[data-gm]').forEach(function (c) { c.classList.toggle('on', c.getAttribute('data-gm') === GF.m); });
  document.querySelectorAll('[data-gs]').forEach(function (c) { c.classList.toggle('on', c.getAttribute('data-gs') === GF.s); });
  document.getElementById('gal').innerHTML = galCards();
});
function vegCell(y, sub, cls) { return '<div' + (cls ? ' class="' + cls + '"' : '') + '><i style="background:' + (COL[y.color] || '#9AA58F') + '"></i>' + E(y.name) + '<small>' + E(sub) + '</small></div>'; }

document.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('[data-m]'); if (!b || !M) return;
  sel = b.getAttribute('data-m');
  document.querySelectorAll('#mains button').forEach(function (c) { c.classList.toggle('on', c.getAttribute('data-m') === sel); });
  document.getElementById('sizes').innerHTML = sizeCards();
});
var menuData = null;
Z.init('healthy', function () {
  if (menuData) { draw(menuData); return; } // 後台預覽改文字時直接重畫，不再重抓菜單
  var tok = ''; try { tok = Z.edit ? sessionStorage.getItem('zt') || '' : ''; } catch (e) {}
  (tok ? Z.post({ action: 'adminHealthPreview', idToken: tok }) : Z.get({ action: 'healthMenu' }))
    .then(function (d) { menuData = d; draw(d); Z.bind(Z._d); }).catch(function (e) { Z.fail(document.getElementById('hx'), e.message); });
});
</script>
