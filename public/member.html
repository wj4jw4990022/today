<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>健康餐會員｜致日子</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1E332F">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" media="print" onload="this.media='all'">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/health.css">
<style>
*{border-radius:0!important}
.mb-wrap{max-width:1080px;margin:0 auto;padding:56px 40px 80px}
.mb-err{border:1px solid #9a3b2b;color:#9a3b2b;background:#fff;padding:12px 16px;margin-bottom:20px;font-size:14px}
.mb-card{background:var(--card);border:1px solid var(--line);padding:32px}
.mb-two{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.mb-line{text-decoration:none;display:flex;align-items:center;justify-content:center;gap:12px;background:#06C755;color:#fff;font-weight:500;letter-spacing:.2em;padding:16px;border:0;width:100%;font:inherit;font-size:15px}
.mb-line i{display:inline-block;width:22px;height:22px;border:2px solid #fff;font-style:normal;font-size:11px;line-height:18px;text-align:center}
.mb-h{font-family:'Noto Serif TC',serif;font-weight:500;font-size:30px;letter-spacing:.12em;margin:6px 0 14px}
.mb-p{font-size:14px;line-height:2;color:var(--mute);margin:0 0 18px}
.mb-f{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.mb-f label{font-size:12px;letter-spacing:.16em;color:var(--mute)}
.mb-f input{font:inherit;font-size:16px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 0;color:var(--ink)}
.mb-ck{font-size:14px;display:flex;gap:8px;align-items:center;margin:6px 0}
.mb-note{border-left:3px solid var(--gold);background:#FBF3E3;padding:12px 16px;font-size:13px;line-height:1.9;margin:16px 0}
.mb-kp{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.mb-kp div{border:1px solid var(--line);background:#fff;padding:14px 16px;font-size:12px;letter-spacing:.12em;color:var(--mute)}
.mb-kp b{display:block;font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:500;color:var(--ink);letter-spacing:0}
.mb-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.mb-tag{font-size:11px;letter-spacing:.15em;border:1px solid var(--gold);color:var(--gold);padding:2px 8px}
.mb-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:24px}
@media(max-width:760px){.mb-wrap{padding:28px 14px}.mb-two,.mb-grid{grid-template-columns:1fr;gap:20px}.mb-kp{grid-template-columns:1fr 1fr}.mb-h{font-size:24px}.mb-card{padding:20px}}
.pl3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 14px}.pl3 button{border:1px solid var(--line);background:#fff;padding:14px;text-align:center;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}.pl3 button.on{outline:2px solid var(--gold);outline-offset:-2px}.pl3 b{display:block;font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:500}@media(max-width:760px){.pl3{grid-template-columns:1fr}}
.mb-ld{font-size:14px;color:var(--mute);padding:40px 0}
.mb-terms{font-size:13px;line-height:2;color:var(--mute);border:1px solid var(--line);background:#fff;padding:14px 18px;margin:10px 0;max-height:240px;overflow:auto}
</style>
</head>
<body class="hk hx">
<div class="hb-dk"><div id="nav"></div></div>
<main id="main"><div class="mb-wrap" id="mb"><div class="mb-ld">載入中…</div></div></main>
<div id="foot"></div>
<script src="assets/config.js"></script>
<script src="assets/demo-data.js"></script>
<script src="assets/app.js"></script>
<script>
/* 健康餐會員（2026-11-06，草圖 m33）：LINE 登入 → 第一次填資料 → 會員中心。登入狀態存在 cookie（伺服器端）。 */
var E = Z.esc, ME = null, EDIT = false, MINE = null, PI = null, PS = { meals: 0, method: '轉帳', mode: 'buy', amt: 0, code: '', l5: '' }, OI = null, PZ = { start: '', days: 3, size: '', main: '', pv: null };
function money(n) { return '$' + Number(n || 0).toLocaleString('en-US'); }
function err() { var m = /[?&]err=([^&]+)/.exec(location.search); return m ? '<div class="mb-err">' + E(decodeURIComponent(m[1])) + '</div>' : ''; }
var TERMS = '<div class="mb-terms"><b>會員條款（草稿，待法律確認）</b><br>1. 訂閱方案每期 30 天，請在期間內預約使用。<br>2. 期間結束還有沒用完的餐：到期前續訂，剩下的餐併入下一期；沒有續訂，已用的餐以單點價格計算後，餘額轉為店內消費金，會員也可以申請退還現金。中途取消也照這個方式計算。<br>3. 預約須在前一天截單時間前完成；截單後不能修改或取消。沒有來取餐，照常扣一餐；因店家原因（送錯、延誤、品質問題）不扣餐數。<br>4. 錢包中的儲值金可申請退還現金；紅利（推薦獲得）只能用於消費，不能退還現金。<br>5. 推薦碼限朋友第一次訂閱使用；店家發現作弊時，可以取消並收回紅利。<br>6. 手機號碼是辨認會員身分的依據，修改請洽門市。<br><br><b>隱私權政策（草稿，待法律確認）</b><br>我們蒐集您的姓名、手機、Email 與 LINE 識別碼，只用於會員服務、訂餐聯繫與通知；不會提供給推薦人、合作店家或其他第三方。您可以隨時洽門市查詢、更正或要求刪除資料（有未結算的方案或錢包餘額時，須先結算）。</div>';

function vLogin() {
  return err() + '<div class="mb-two"><div><div class="hb-en">Member</div><div class="mb-h">健康餐會員</div>' +
    '<p class="mb-p">用 LINE 登入就能成為會員：查看方案與剩餘餐數、錢包與紅利、自己的推薦碼。<br>登入後可以直接線上訂餐。</p></div>' +
    '<div class="mb-card">' + (ME.lineReady ? '<a class="mb-line" href="/api/line/login"><i>L</i>用 LINE 登入</a>' : '<span class="mb-line" style="opacity:.5">LINE 登入準備中</span>') +
    '<p class="mb-p" style="margin:14px 0 0;font-size:12px">登入時 LINE 會詢問是否加入「致日子」官方帳號好友，加入後可收到取餐與訂閱通知。</p></div></div>';
}
function vRegister() {
  return err() + '<div class="mb-two" style="align-items:start"><div><div class="hb-en">Welcome</div><div class="mb-h">嗨，' + E(ME.lineName || '你好') + '</div>' +
    '<p class="mb-p">第一次登入，請填寫基本資料。<br>如果您<b>之前已經在門市建立過會員</b>（店員幫您儲值或買過方案），請填一樣的手機號碼，店員確認後會把資料合併到這個 LINE 帳號。</p></div>' +
    '<div class="mb-card"><div class="mb-f"><label>姓名</label><input id="r-name" maxlength="30"></div>' +
    '<div class="mb-f"><label>手機</label><input id="r-phone" inputmode="tel" maxlength="12" placeholder="09xxxxxxxx"></div>' +
    '<div class="mb-f"><label>Email（選填）</label><input id="r-email" type="email" maxlength="120"></div>' + TERMS +
    '<label class="mb-ck"><input type="checkbox" id="r-t1"> 我同意會員條款</label><label class="mb-ck"><input type="checkbox" id="r-t2"> 我同意隱私權政策</label>' +
    '<div id="r-msg"></div><div style="margin-top:18px"><button class="hb-btn g" style="display:block;width:100%" id="r-go">完成註冊</button></div></div></div>';
}
function vCenter() {
  var w = ME.wallet, s = ME.sub;
  var note = ME.pending ? '<div class="mb-note"><b>資料合併審核中</b>：這支手機在門市已有會員資料（錢包、方案）。店員確認是本人後會合併，合併前錢包與方案暫時顯示為 0。若急需使用，請到門市或傳 LINE 給我們。</div>'
    : ME.needPhone ? '<div class="mb-note"><b>請補填手機</b>：店員確認您和門市的另一位會員不是同一人，請在「修改資料」填寫您自己的手機。</div>' : '';
  var prof = EDIT ? '<div class="mb-f"><label>姓名</label><input id="e-name" value="' + E(ME.name) + '"></div><div class="mb-f"><label>Email（選填）</label><input id="e-email" type="email" value="' + E(ME.email) + '"></div>' +
      (ME.needPhone ? '<div class="mb-f"><label>手機</label><input id="e-phone" inputmode="tel"></div>' : '<p class="mb-p" style="font-size:12px;margin:0 0 10px">手機修改請洽門市。</p>') +
      '<div id="e-msg"></div><div style="display:flex;gap:10px"><button class="hb-btn g" id="e-go" style="flex:1">儲存</button><button class="hb-btn" id="e-x" style="flex:1">取消</button></div>'
    : '<div class="mb-row"><span>手機</span><span>' + (ME.phone ? E(ME.phone) + (ME.phoneOk ? '' : ' <span class="mb-tag">待核對</span>') : '—') + '</span></div><div class="mb-row"><span>Email</span><span>' + (E(ME.email) || '—') + '</span></div><div style="margin-top:14px"><button class="hb-btn" style="display:block;width:100%" id="e-open">修改資料</button></div>';
  return err() + '<div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px"><div><div class="hb-en">My page</div><div class="mb-h" style="margin-bottom:0">' + E(ME.name) + '</div></div><div class="mb-p" style="margin:0">' + E(ME.id) + '・LINE 已綁定・<a href="/api/line/logout" style="text-decoration:underline">登出</a></div></div>' + note +
    '<div class="mb-kp"><div>錢包總餘額<b>' + money(w.total) + '</b></div><div>可退現金<b>' + money(w.cash) + '</b></div><div>紅利<b>' + money(w.bonus) + '</b></div><div>本期剩餘<b>' + (s ? s.left + '/' + s.meals : '—') + '</b></div></div>' +
    vPlan() + vManage() + (ME.pending ? '' : '<div class="mb-card" style="margin-bottom:24px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div class="hb-cap" style="margin:0">即將取餐</div><a class="hb-btn g" href="order.html">＋ 訂餐</a></div>' +
      (MINE === null ? '<p class="mb-p">載入中…</p>' : MINE.length ? MINE.map(function (r) { var md = r.date.slice(5).replace('-', '/'); return '<div class="mb-row"><span>' + md + ' ' + E(r.slot) + '・' + E(r.size + ' ' + r.main) + (r.qty > 1 ? ' ×' + r.qty : '') + '<br><small style="color:var(--mute)">' + E(r.kind) + '・' + (r.pickup === '配送' ? '配送點' : r.pickup === '地址' ? '送到地址' : '自取') + '・' + E(r.sauce) + (r.charge === '餘額不足改回基本餐' ? '・錢包不足已改回基本餐' : '') + '</small></span><span>' + (r.status === '已預約' ? '<a href="order.html?change=' + encodeURIComponent(r.orderId || r.id) + '&item=' + encodeURIComponent(r.itemId) + '" style="text-decoration:underline">改期</a>　<a href="#" data-cx="' + E(r.id) + '" style="text-decoration:underline">取消</a>' : '<span class="mb-tag">' + E(r.status) + '</span>') + '</span></div>'; }).join('') : '<p class="mb-p" style="margin:10px 0 0">還沒有預約。</p>') + '</div>') +
    '<div class="mb-grid"><div class="mb-card"><div class="hb-cap">我的方案</div>' +
    (s ? '<div class="mb-row"><span>目前方案</span><span>' + s.meals + ' 餐（' + E(s.status) + '）</span></div><div class="mb-row"><span>期間</span><span>' + E(s.start) + ' ～ ' + E(s.end) + '</span></div><div class="mb-row"><span>剩餘</span><span>' + s.left + ' 餐</span></div>'
       : '<div class="mb-row"><span>目前方案</span><span>尚無</span></div><div class="mb-row"><span>購買方式</span><span>在上方「訂閱方案」購買</span></div>') +
    '<div class="hb-cap" style="margin-top:22px">錢包紀錄</div>' + (ME.ledger.length ? ME.ledger.map(function (r) { return '<div class="mb-row"><span>' + E(r.at.slice(5)) + '　' + E(r.type) + '</span><span>' + (r.amount >= 0 ? '+' : '−') + Math.abs(r.amount).toLocaleString('en-US') + (r.amount > 0 && !r.refundable ? ' <span class="mb-tag">紅利</span>' : '') + '</span></div>'; }).join('') : '<div class="mb-row"><span>還沒有紀錄</span><span></span></div>') + '</div>' +
    '<div class="mb-card"><div class="hb-cap">我的推薦碼</div>' + (ME.pending ? '<p class="mb-p">合併完成後顯示。</p>' :
      '<div style="font-family:\'Cormorant Garamond\',serif;font-size:40px;letter-spacing:.2em;margin:10px 0">' + E(ME.code) + '</div><button class="hb-btn" style="display:block;width:100%" id="cp">複製推薦碼</button>' +
      '<p class="mb-p" style="margin:14px 0 0;font-size:13px">朋友第一次訂閱時使用，朋友得紅利；朋友取餐滿 ' + ME.referrerMeals + ' 餐，您得紅利 ' + ME.referrerBonus + ' 元。紅利只能消費，不能退現金。</p>') +
    '<div class="hb-cap" style="margin-top:20px">個人資料</div>' + prof + '</div></div>' + vAccount();
}

function vPlan() {
  if (!PI || ME.pending) return '';
  var w = PI.wallet, plan = PI.plans.filter(function (p) { return p.meals === PS.meals; })[0] || PI.plans[0], ch = function (on) { return 'style="padding:8px 14px;border:1px solid ' + (on ? 'var(--gold);background:var(--gold);color:#fff' : 'var(--line);background:#fff') + ';font:inherit;font-size:13px;cursor:pointer"'; };
  if (PI.pending) { var q = PI.pending; return '<div class="mb-note"><b>' + (q.kind === '退款' ? '退款處理中' : '付款確認中') + '</b>：' + E(q.at.slice(5)) + ' 送出「' + (q.kind === '退款' ? '退款 ' + money(q.amount) : q.kind === '儲值並購買' ? '儲值 ' + money(q.amount) + ' 並購買 ' + q.meals + ' 餐' : '儲值 ' + money(q.amount)) + '」（' + E(q.method) + (q.last5 ? ' 末五碼 ' + E(q.last5) : '') + '）。店員確認後' + (q.kind === '儲值並購買' ? '開通方案' : q.kind === '退款' ? '退款' : '入帳') + '。<a href="#" data-pcx style="float:right;text-decoration:underline">取消申請</a><br><small>' + E(q.kind === '退款' ? (q.method === '門市領現' ? '請到門市領取' : '店員會轉到你填的帳號') : (PI.howto[q.method] || '')) + '</small></div>'; }
  if (!plan) return '';
  var need = plan.total - w.total, renew = !!PI.sub, howto = PI.howto[PS.method] || '';
  var pay = '<div class="hb-cap" style="margin-top:16px">付款方式</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px">' + ['轉帳', 'LINE Pay', '門市付現'].map(function (m) { return '<button type="button" data-pm="' + m + '" ' + ch(PS.method === m) + '>' + (m === '門市付現' ? '到門市付現' : m) + '</button>'; }).join('') + '</div>' +
    '<div class="mb-note" style="margin:6px 0 12px;white-space:pre-line">' + E(howto) + '</div>' + (PS.method === '轉帳' ? '<div class="mb-f"><label>轉帳末五碼</label><input id="p-l5" inputmode="numeric" maxlength="5" value="' + E(PS.l5) + '"></div>' : '');
  var body = PS.mode === 'buy'
    ? '<div class="pl3">' + PI.plans.map(function (p) { return '<button type="button" data-pp="' + p.meals + '" class="' + (p.meals === plan.meals ? 'on' : '') + '">' + p.meals + ' 餐<b>' + money(p.total) + '</b>每餐 ' + (p.per || Math.round(p.total / p.meals)) + '</button>'; }).join('') + '</div>' +
      (!renew && !PI.ever ? '<div class="mb-f"><label>朋友的推薦碼（選填，第一次訂閱得紅利）</label><input id="p-code" maxlength="6" style="text-transform:uppercase" value="' + E(PS.code) + '"></div>' : '') +
      '<div class="mb-row"><span>' + (renew ? '續訂 ' : '') + plan.meals + ' 餐方案</span><span>' + money(plan.total) + '</span></div><div class="mb-row"><span>錢包餘額</span><span>' + money(w.total) + '</span></div>' +
      (renew ? '<div class="mb-row"><span>續訂後</span><span>新一期今天起 ' + PI.days + ' 天，共 ' + (plan.meals + PI.sub.left) + ' 餐</span></div>' : '') +
      (need <= 0 ? '<button class="hb-btn g" style="display:block;width:100%;margin-top:14px" data-pbuy>用錢包' + (renew ? '續訂' : '購買') + '</button>'
        : '<div class="mb-row"><span>還需要付</span><span><b>' + money(need) + '</b></span></div>' + pay + '<button class="hb-btn g" style="display:block;width:100%" data-preq>送出：儲值 ' + money(need) + ' 並' + (renew ? '續訂 ' : '購買 ') + plan.meals + ' 餐</button>')
    : '<div class="hb-cap" style="margin-top:6px">儲值金額</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px">' + PI.topup.map(function (a) { return '<button type="button" data-pa="' + a + '" ' + ch(PS.amt === a) + '>' + money(a) + '</button>'; }).join('') + '</div>' + pay + '<button class="hb-btn g" style="display:block;width:100%" data-preq>送出：儲值 ' + money(PS.amt) + '</button>';
  return '<div class="mb-card" style="margin-bottom:24px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><div class="hb-cap" style="margin:0">' + (renew ? '續訂方案' : '訂閱方案') + '</div><div>' + '<a href="#" data-pmode="buy" style="margin-right:12px;' + (PS.mode === 'buy' ? 'color:var(--gold);text-decoration:underline' : '') + '">' + (renew ? '續訂' : '買方案') + '</a><a href="#" data-pmode="topup" style="' + (PS.mode === 'topup' ? 'color:var(--gold);text-decoration:underline' : '') + '">只儲值</a></div></div>' +
    '<p class="mb-p" style="margin:6px 0 0;font-size:13px">一期 ' + PI.days + ' 天，前一天 20:00 前預約；錢包不夠時先付款，店員確認收款後自動開通。</p>' + body + '<div id="p-msg"></div></div>';
}

function vManage() {
  if (!OI || !OI.sub || OI.sub.status !== '使用中' || ME.pending) return '';
  var s = OI.sub, ch = function (on) { return 'style="padding:8px 14px;border:1px solid ' + (on ? 'var(--gold);background:var(--gold);color:#fff' : 'var(--line);background:#fff') + ';font:inherit;font-size:13px;cursor:pointer;margin:0 6px 6px 0"'; };
  var ad = function (d, n) { var t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
  var md = function (d) { return d ? Number(d.slice(5, 7)) + '/' + Number(d.slice(8)) : ''; };
  var okDays = OI.days.filter(function (d) { return d.date <= s.end; });
  if (!PZ.start && okDays.length) PZ.start = okDays[0].date;
  var pause = s.pauseStart ? '<p class="mb-p" style="margin:8px 0 0">本期已暫停：<b>' + md(s.pauseStart) + ' ～ ' + md(s.pauseEnd) + '</b>，到期日已延到 ' + md(s.end) + '。每期只能暫停一次。</p>'
    : '<div class="mb-f"><label>從哪一天開始</label><select id="z-start" style="font:inherit;font-size:16px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 0">' + okDays.map(function (d) { return '<option value="' + d.date + '"' + (d.date === PZ.start ? ' selected' : '') + '>' + d.date + '（' + '日一二三四五六'.charAt(d.wd) + '）</option>'; }).join('') + '</select></div>' +
      '<div class="hb-cap">暫停天數</div><div>' + [1, 2, 3, 4, 5, 6, 7].map(function (n) { return '<button type="button" data-zd="' + n + '" ' + ch(PZ.days === n) + '>' + n + ' 天</button>'; }).join('') + '</div>' +
      '<div class="mb-row"><span>暫停期間</span><span>' + md(PZ.start) + ' ～ ' + md(ad(PZ.start, PZ.days - 1)) + '</span></div><div class="mb-row"><span>到期日</span><span>' + md(s.end) + ' → <b>' + md(ad(s.end, PZ.days)) + '</b></span></div>' +
      '<div class="mb-row"><span>期間內已訂的餐</span><span>' + (MINE || []).filter(function (r) { return r.kind === '訂閱' && r.status === '已預約' && r.date >= PZ.start && r.date <= ad(PZ.start, PZ.days - 1); }).length + ' 筆自動取消、加回餐數</span></div>' +
      '<button class="hb-btn g" style="display:block;width:100%;margin-top:14px" data-zgo>確認暫停</button><p class="mb-p" style="font-size:12px;margin:10px 0 0">送出後不能取消或提前恢復（請洽門市）。</p>';
  var sizes = [], mains = [], order = ['LIGHT', 'BALANCE', 'POWER'];
  OI.items.forEach(function (i) { if (sizes.indexOf(i.size) < 0) sizes.push(i.size); if (mains.indexOf(i.main) < 0) mains.push(i.main); });
  sizes.sort(function (a, b) { return order.indexOf(a) - order.indexOf(b); });
  if (!PZ.size) PZ.size = s.upgSize || sizes[1] || sizes[0]; if (!PZ.main) PZ.main = s.upgMain || mains[0];
  var pick = OI.items.filter(function (i) { return i.size === PZ.size && i.main === PZ.main; })[0], diff = pick ? pick.upg - (s.upgValue || 0) : 0;
  var upg = (s.upgSize ? '<p class="mb-p" style="margin:6px 0">目前已整期升級：<b>' + E(s.upgSize + ' ' + s.upgMain) + '</b>（每餐 +' + s.upgValue + '）。可以再升到更高的組合，只補差額。</p>' : '') +
    '<div class="hb-cap">份量</div><div>' + sizes.map(function (x) { return '<button type="button" data-zs="' + E(x) + '" ' + ch(PZ.size === x) + '>' + E(x) + '</button>'; }).join('') + '</div>' +
    '<div class="hb-cap" style="margin-top:6px">主菜</div><div>' + mains.map(function (x) { return '<button type="button" data-zm="' + E(x) + '" ' + ch(PZ.main === x) + '>' + E(x) + '</button>'; }).join('') + '</div>' +
    (!pick ? '<p class="mb-p">沒有這個組合</p>' : diff <= 0 ? '<p class="mb-p" style="margin:8px 0 0">' + (s.upgValue ? '請選比目前更高的組合' : '這是基本餐，不用升級') + '</p>' :
      '<div class="mb-row"><span>每餐差額</span><span>$' + diff + '</span></div>' + (PZ.pv ? '<div class="mb-row"><span>適用餐數</span><span>剩 ' + PZ.pv.left + ' 餐＋已訂未截單 ' + PZ.pv.open + ' 餐＝' + PZ.pv.n + ' 餐</span></div><div class="mb-row"><span>從錢包扣</span><span><b>' + money(PZ.pv.total) + '</b>（餘額 ' + money(OI.wallet.total) + '）</span></div><button class="hb-btn g" style="display:block;width:100%;margin-top:14px" data-zup>確認整期升級</button>' : '<button class="hb-btn" style="display:block;width:100%;margin-top:14px" data-zpv>計算金額</button>')) +
    '<p class="mb-p" style="font-size:12px;margin:10px 0 0">升級後訂餐預設用這個組合；改訂較便宜的組合，截單時退差額到錢包。續訂或結算時，沒用到的升級差額退回錢包。</p>';
  return '<div class="mb-grid" style="margin-bottom:24px"><div class="mb-card"><div class="hb-cap">暫停方案</div><p class="mb-p" style="font-size:13px;margin:6px 0 10px">每期可暫停 1 次、最多 7 天；暫停幾天，到期日就往後延幾天。</p>' + pause + '<div id="z-msg"></div></div>' +
    '<div class="mb-card"><div class="hb-cap">整期升級</div><p class="mb-p" style="font-size:13px;margin:6px 0 10px">一次把本期剩下的餐都升級；之後訂餐不再每餐扣差額。</p>' + upg + '<div id="u-msg"></div></div></div>';
}

var RF = { method: '門市領現', amt: '', acct: '' };
function vAccount() {
  if (ME.pending || !PI) return '';
  var cash = PI.wallet.cash, ch = function (on) { return 'style="padding:8px 14px;border:1px solid ' + (on ? 'var(--gold);background:var(--gold);color:#fff' : 'var(--line);background:#fff') + ';font:inherit;font-size:13px;cursor:pointer;margin:0 6px 6px 0"'; };
  var refund = PI.pending ? '<p class="mb-p" style="margin:6px 0 0">有一筆申請處理中，處理完才能再申請。</p>' : cash <= 0 ? '<p class="mb-p" style="margin:6px 0 0">目前沒有可退的金額（紅利不能退現金）。</p>' :
    '<p class="mb-p" style="margin:6px 0 10px;font-size:13px">可退現金 ' + money(cash) + '（紅利不能退）。店員處理後從錢包扣除。</p><div class="mb-f"><label>退款金額</label><input id="rf-amt" inputmode="numeric" value="' + E(RF.amt || cash) + '"></div>' +
    '<div class="hb-cap">退款方式</div><div>' + ['門市領現', '轉帳'].map(function (m) { return '<button type="button" data-rfm="' + m + '" ' + ch(RF.method === m) + '>' + m + '</button>'; }).join('') + '</div>' +
    (RF.method === '轉帳' ? '<div class="mb-f"><label>退款帳號（銀行、分行、帳號、戶名）</label><input id="rf-acct" value="' + E(RF.acct) + '"></div>' : '') + '<button class="hb-btn" style="display:block;width:100%" data-rfgo>送出退款申請</button>';
  return '<div class="mb-grid" style="margin-top:24px"><div class="mb-card"><div class="hb-cap">申請退款</div>' + refund + '<div id="rf-msg"></div></div>' +
    '<div class="mb-card"><div class="hb-cap">刪除帳號</div><p class="mb-p" style="margin:6px 0 10px;font-size:13px">刪除後會清除姓名、手機、Email 與 LINE 綁定；交易紀錄依法保留。還有方案、錢包餘額、未取的預約或處理中的申請時不能刪除。</p><button class="hb-btn" style="display:block;width:100%;color:#9a3b2b;border-color:#9a3b2b" data-del>刪除我的帳號</button><div id="del-msg"></div></div></div>';
}
function draw() { document.getElementById('mb').innerHTML = !ME.login ? vLogin() : !ME.registered ? vRegister() : vCenter(); }
function load() {
  return Z.post({ action: 'memberMe' }).then(function (d) {
    ME = d;
    if (d.login && d.registered && !d.pending) { var after = ''; try { after = localStorage.getItem('zr_after') || ''; localStorage.removeItem('zr_after'); } catch (x) {} if (/^\/order\.html/.test(after)) { location.href = after; return; } }
    draw();
    if (d.registered && !d.pending) {
      Z.post({ action: 'orderInfo' }).then(function (o) { OI = o; MINE = o.mine; draw(); }).catch(function () { MINE = []; draw(); });
      Z.post({ action: 'payInfo' }).then(function (o) { PI = o; if (!PS.meals && o.plans.length) PS.meals = (o.plans[1] || o.plans[0]).meals; if (!PS.amt) PS.amt = o.topup[0] || 0; draw(); }).catch(function () {});
    }
  }).catch(function (e) { Z.fail(document.getElementById('mb'), e.message); });
}
function v(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
function say(id, m) { document.getElementById(id).innerHTML = '<div class="mb-err" style="margin:10px 0 0">' + E(m) + '</div>'; }
document.addEventListener('click', function (e) {
  var t = e.target;
  if (t.id === 'r-go') { t.disabled = true; Z.post({ action: 'memberRegister', name: v('r-name'), phone: v('r-phone'), email: v('r-email'), agreeTerms: document.getElementById('r-t1').checked, agreePrivacy: document.getElementById('r-t2').checked }).then(load).catch(function (er) { t.disabled = false; say('r-msg', er.message); }); }
  if (t.id === 'e-open') { EDIT = true; draw(); }
  if (t.id === 'e-x') { EDIT = false; draw(); }
  if (t.id === 'e-go') Z.post({ action: 'memberUpdate', name: v('e-name'), email: v('e-email'), phone: v('e-phone') }).then(function () { EDIT = false; return load(); }).catch(function (er) { say('e-msg', er.message); });
  if (t.hasAttribute && t.hasAttribute('data-cx')) { e.preventDefault(); if (!confirm('確定取消這一餐？訂閱會加回餐數，單點會退回錢包。')) return; Z.post({ action: 'orderCancel', resId: t.getAttribute('data-cx') }).then(load).catch(function (er) { alert(er.message); }); }
  var rb = t.closest && t.closest('[data-rfm],[data-rfgo],[data-del]');
  if (rb) {
    if (rb.hasAttribute('data-rfm')) { RF.method = rb.getAttribute('data-rfm'); draw(); return; }
    if (rb.hasAttribute('data-rfgo')) { var amt = Number(v('rf-amt').replace(/,/g, '')); if (!confirm('申請退款 ' + money(amt) + '（' + RF.method + '）？')) return; rb.disabled = true; Z.post({ action: 'payRefund', amount: amt, method: RF.method, account: RF.acct }).then(function () { RF.amt = ''; PI = null; load(); }).catch(function (er) { rb.disabled = false; say('rf-msg', er.message); }); return; }
    if (rb.hasAttribute('data-del')) { var w = prompt('確定要刪除帳號？刪除後無法復原。\n請輸入「刪除」兩個字確認：'); if (w === null) return; Z.post({ action: 'memberDelete', confirm: w.trim() }).then(function () { alert('帳號已刪除'); location.href = 'healthy.html'; }).catch(function (er) { say('del-msg', er.message); }); return; }
  }
  var zb = t.closest && t.closest('[data-zd],[data-zs],[data-zm],[data-zpv],[data-zup],[data-zgo]');
  if (zb) {
    if (zb.hasAttribute('data-zd')) PZ.days = Number(zb.getAttribute('data-zd'));
    else if (zb.hasAttribute('data-zs')) { PZ.size = zb.getAttribute('data-zs'); PZ.pv = null; }
    else if (zb.hasAttribute('data-zm')) { PZ.main = zb.getAttribute('data-zm'); PZ.pv = null; }
    else if (zb.hasAttribute('data-zpv')) { Z.post({ action: 'planUpgrade', size: PZ.size, main: PZ.main, preview: true }).then(function (r) { PZ.pv = r; draw(); }).catch(function (er) { say('u-msg', er.message); }); return; }
    else if (zb.hasAttribute('data-zup')) { if (!confirm('整期升級為 ' + PZ.size + ' ' + PZ.main + '，從錢包扣 ' + money(PZ.pv.total) + '？')) return; zb.disabled = true; Z.post({ action: 'planUpgrade', size: PZ.size, main: PZ.main }).then(function () { PZ.pv = null; load(); }).catch(function (er) { zb.disabled = false; say('u-msg', er.message); }); return; }
    else if (zb.hasAttribute('data-zgo')) { if (!confirm('確認從 ' + PZ.start + ' 暫停 ' + PZ.days + ' 天？送出後不能取消。')) return; zb.disabled = true; Z.post({ action: 'planPause', start: PZ.start, days: PZ.days }).then(function () { load(); }).catch(function (er) { zb.disabled = false; say('z-msg', er.message); }); return; }
    draw(); return;
  }
  var pb = t.closest && t.closest('[data-pm],[data-pp],[data-pa],[data-pmode],[data-pbuy],[data-preq],[data-pcx]');
  if (pb) {
    e.preventDefault();
    if (pb.hasAttribute('data-pm')) PS.method = pb.getAttribute('data-pm');
    else if (pb.hasAttribute('data-pp')) PS.meals = Number(pb.getAttribute('data-pp'));
    else if (pb.hasAttribute('data-pa')) PS.amt = Number(pb.getAttribute('data-pa'));
    else if (pb.hasAttribute('data-pmode')) PS.mode = pb.getAttribute('data-pmode');
    else if (pb.hasAttribute('data-pcx')) { if (confirm('取消這筆付款申請？')) Z.post({ action: 'payCancel' }).then(load).catch(function (er) { alert(er.message); }); return; }
    else if (pb.hasAttribute('data-pbuy')) { if (!confirm('用錢包' + (PI.sub ? '續訂 ' : '購買 ') + PS.meals + ' 餐方案？')) return; pb.disabled = true; Z.post({ action: 'payBuy', meals: PS.meals, code: PS.code }).then(function () { PI = null; PS.code = ''; load(); }).catch(function (er) { pb.disabled = false; say('p-msg', er.message); }); return; }
    else if (pb.hasAttribute('data-preq')) { pb.disabled = true; Z.post({ action: 'payRequest', kind: PS.mode === 'buy' ? '儲值並購買' : '儲值', meals: PS.meals, amount: PS.amt, code: PS.code, method: PS.method, last5: PS.l5 }).then(function () { PI = null; load(); }).catch(function (er) { pb.disabled = false; say('p-msg', er.message); }); return; }
    draw(); return;
  }
  if (t.id === 'cp') { try { navigator.clipboard.writeText(ME.code); t.textContent = '已複製'; } catch (x) { prompt('推薦碼', ME.code); } }
});
// 輸入框的內容記在 PS，畫面重畫（例如切換付款方式）時不會被清掉
document.addEventListener('change', function (e) { if (e.target.id === 'z-start') { PZ.start = e.target.value; draw(); } });
document.addEventListener('input', function (e) { if (e.target.id === 'rf-amt') RF.amt = e.target.value; if (e.target.id === 'rf-acct') RF.acct = e.target.value; });
document.addEventListener('input', function (e) { if (e.target.id === 'p-code') PS.code = e.target.value.trim().toUpperCase(); if (e.target.id === 'p-l5') PS.l5 = e.target.value.trim(); });
Z.init('healthy', load);
</script>
</body>
</html>
