<style>
*{border-radius:0!important}
.mb-wrap{max-width:1080px;margin:0 auto;padding:56px 40px 80px}
.mb-err{border:1px solid #9a3b2b;color:#9a3b2b;background:#fff;padding:12px 16px;margin-bottom:20px;font-size:14px}
.mb-card{background:var(--card);border:1px solid var(--line);padding:32px}
.mb-two{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.mb-line{text-decoration:none;display:flex;align-items:center;justify-content:center;gap:12px;background:#06C755;color:#fff;font-weight:500;letter-spacing:.2em;padding:16px;border:0;width:100%;font:inherit;font-size:15px}
.mb-line i{display:inline-block;width:22px;height:22px;border:2px solid #fff;font-style:normal;font-size:11px;line-height:18px;text-align:center}
.mb-h{font-family:'Noto Serif TC',serif;font-weight:500;font-size:30px;letter-spacing:.12em;margin:6px 0 14px}
.mb-p{font-size:14px;line-height:2;color:var(--mute);margin:0 0 18px}
.mb-f{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.mb-f label{font-size:12px;letter-spacing:.16em;color:var(--mute)}
.mb-f input{font:inherit;font-size:16px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 0;color:var(--ink)}
.mb-ck{font-size:14px;display:flex;gap:8px;align-items:center;margin:6px 0}
.mb-note{border-left:3px solid var(--gold);background:#FBF3E3;padding:12px 16px;font-size:13px;line-height:1.9;margin:16px 0}
.mb-kp{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.mb-kp div{border:1px solid var(--line);background:#fff;padding:14px 16px;font-size:12px;letter-spacing:.12em;color:var(--mute)}
.mb-kp b{display:block;font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:500;color:var(--ink);letter-spacing:0}
.mb-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.mb-tag{font-size:11px;letter-spacing:.15em;border:1px solid var(--gold);color:var(--gold);padding:2px 8px}
.mb-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:24px}
@media(max-width:760px){.mb-wrap{padding:28px 14px}.mb-two,.mb-grid{grid-template-columns:1fr;gap:20px}.mb-kp{grid-template-columns:1fr 1fr}.mb-h{font-size:24px}.mb-card{padding:20px}}
.pl3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 14px}.pl3 button{border:1px solid var(--line);background:#fff;padding:14px;text-align:center;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}.pl3 button.on{outline:2px solid var(--gold);outline-offset:-2px}.pl3 b{display:block;font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:500}@media(max-width:760px){.pl3{grid-template-columns:1fr}}
.mm{display:grid;grid-template-columns:360px 1fr;gap:32px;align-items:start}
.mm-l{position:sticky;top:16px;display:flex;flex-direction:column;gap:14px}
.mm-card{background:var(--dark);color:#EFE8DA;padding:20px 22px;border:1px solid var(--gold)}
.mm-id{font-size:11px;letter-spacing:.14em;opacity:.7}.mm-nm{font-family:'Noto Serif TC',serif;font-size:24px;letter-spacing:.12em;margin-top:2px}
.mm-g{display:grid;grid-template-columns:1fr 1fr;margin-top:14px;border-top:1px solid rgba(217,180,119,.4)}.mm-g div{padding:12px 0 2px;font-size:11px;letter-spacing:.14em;opacity:.85}.mm-g b{display:block;font-family:'Cormorant Garamond','Noto Serif TC',serif;font-size:26px;font-weight:500;color:#D9B477;letter-spacing:0;margin-top:2px}
.mm-go{display:block;text-align:center;background:var(--gold);color:#fff;padding:15px;letter-spacing:.3em;font-size:15px}
.mm-tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}.mm-tabs button{flex:1;min-width:64px;background:transparent;border:0;border-bottom:2px solid transparent;padding:12px 4px;font:inherit;font-size:14px;color:var(--mute);cursor:pointer}.mm-tabs button.on{color:var(--ink);border-bottom-color:var(--gold);font-weight:500}
.mm-it{background:var(--card);border:1px solid var(--line);padding:14px 16px;margin-bottom:10px}.mm-ith{display:flex;justify-content:space-between;gap:10px;font-size:15px}.mm-ith a{color:var(--gold);text-decoration:underline;margin-left:12px;font-size:13px}.mm-ith em{font-style:normal;font-size:12px;color:var(--gold);border:1px solid var(--gold);padding:1px 8px}
.mm-its{font-size:12px;color:var(--mute);margin:2px 0 6px}.mm-itl{font-size:14px;padding:4px 0;border-top:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px}.mm-itl span{font-size:12px;color:var(--mute);text-align:right}
.mm-more{display:block;width:100%;background:transparent;border:1px solid var(--gold);color:var(--gold);padding:11px;font:inherit;font-size:14px;cursor:pointer;margin-top:6px}
.mm-sec{font-size:12px;letter-spacing:.18em;color:var(--gold);margin:4px 0 6px}
.mm-acc{border:1px solid var(--line);background:var(--card);margin-bottom:8px}.mm-acc.on{border-color:var(--gold)}.mm-acch{display:flex;justify-content:space-between;align-items:center;width:100%;background:transparent;border:0;padding:14px 16px;font:inherit;font-size:15px;text-align:left;cursor:pointer;color:var(--ink)}.mm-acch small{display:block;font-size:12px;color:var(--mute)}.mm-acch i{font-style:normal;color:var(--gold)}.mm-accb{padding:0 16px 16px}
.mm-code{font-family:'Cormorant Garamond',serif;font-size:46px;letter-spacing:.24em;margin:6px 0 12px}
.mm-del{margin-top:28px;text-align:center;font-size:12px;color:var(--mute)}.mm-del a{color:#9a3b2b;text-decoration:underline;font-size:13px}.mm-del small{display:block;margin-top:4px}
@media(max-width:860px){.mm{grid-template-columns:1fr;gap:16px}.mm-l{position:static}.mm-tabs button{font-size:13px}}
.mb-ld{font-size:14px;color:var(--mute);padding:40px 0}
.mb-terms{font-size:13px;line-height:2;color:var(--mute);border:1px solid var(--line);background:#fff;padding:14px 18px;margin:10px 0;max-height:240px;overflow:auto}
</style>

<script>
/* 健康餐會員（2026-11-06，草圖 m33）：LINE 登入 → 第一次填資料 → 會員中心。登入狀態存在 cookie（伺服器端）。 */
var E = Z.esc, ME = null, EDIT = false, MINE = null, PI = null, PS = { meals: 0, method: '轉帳', mode: 'buy', amt: 0, code: '', l5: '' }, OI = null, PZ = { start: '', days: 3, size: '', main: '', pv: null };
function money(n) { return '$' + Number(n || 0).toLocaleString('en-US'); }
function err() { var m = /[?&]err=([^&]+)/.exec(location.search); return m ? '<div class="mb-err">' + E(decodeURIComponent(m[1])) + '</div>' : ''; }
var TERMS = '<div class="mb-terms"><b>會員條款（草稿，待法律確認）</b><br>1. 訂閱方案每期 30 天，請在期間內預約使用。<br>2. 期間結束還有沒用完的餐：到期前續訂，剩下的餐併入下一期；沒有續訂，已用的餐以單點價格計算後，餘額轉為店內消費金，會員也可以申請退還現金。中途取消也照這個方式計算。<br>3. 預約須在前一天截單時間前完成；截單後不能修改或取消。沒有來取餐，照常扣一餐；因店家原因（送錯、延誤、品質問題）不扣餐數。<br>4. 錢包中的儲值金可申請退還現金；紅利（推薦獲得）只能用於消費，不能退還現金。<br>5. 推薦碼限朋友第一次訂閱使用；店家發現作弊時，可以取消並收回紅利。<br>6. 手機號碼是辨認會員身分的依據，修改請洽門市。<br><br><b>隱私權政策（草稿，待法律確認）</b><br>我們蒐集您的姓名、手機、Email 與 LINE 識別碼，只用於會員服務、訂餐聯繫與通知；不會提供給推薦人、合作店家或其他第三方。您可以隨時洽門市查詢、更正或要求刪除資料（有未結算的方案或錢包餘額時，須先結算）。</div>';

function vLogin() {
  return err() + '<div class="mb-two"><div><div class="hb-en">Member</div><div class="mb-h">健康餐會員</div>' +
    '<p class="mb-p">用 LINE 登入就能成為會員：查看方案與剩餘餐數、錢包與紅利、自己的推薦碼。<br>登入後可以直接線上訂餐。</p></div>' +
    '<div class="mb-card">' + (ME.lineReady ? '<a class="mb-line" href="/api/line/login"><i>L</i>用 LINE 登入</a>' : '<span class="mb-line" style="opacity:.5">LINE 登入準備中</span>') +
    '<p class="mb-p" style="margin:14px 0 0;font-size:12px">登入時 LINE 會詢問是否加入「致日子」官方帳號好友，加入後可收到取餐與訂閱通知。</p></div></div>';
}
function vRegister() {
  return err() + '<div class="mb-two" style="align-items:start"><div><div class="hb-en">Welcome</div><div class="mb-h">嗨，' + E(ME.lineName || '你好') + '</div>' +
    '<p class="mb-p">第一次登入，請填寫基本資料。<br>如果您<b>之前已經在門市建立過會員</b>（店員幫您儲值或買過方案），請填一樣的手機號碼，店員確認後會把資料合併到這個 LINE 帳號。</p></div>' +
    '<div class="mb-card"><div class="mb-f"><label>姓名</label><input id="r-name" maxlength="30"></div>' +
    '<div class="mb-f"><label>手機</label><input id="r-phone" inputmode="tel" maxlength="12" placeholder="09xxxxxxxx"></div>' +
    '<div class="mb-f"><label>Email（選填）</label><input id="r-email" type="email" maxlength="120"></div>' + TERMS +
    '<label class="mb-ck"><input type="checkbox" id="r-t1"> 我同意會員條款</label><label class="mb-ck"><input type="checkbox" id="r-t2"> 我同意隱私權政策</label>' +
    '<div id="r-msg"></div><div style="margin-top:18px"><button class="hb-btn g" style="display:block;width:100%" id="r-go">完成註冊</button></div></div></div>';
}
var TAB = 'meals', OPEN = '', PAST = false, ALLLED = false;
function pendNote() {
  if (!PI || !PI.pending) return '';
  var q = PI.pending;
  return '<div class="mb-note"><b>' + (q.kind === '退款' ? '退款處理中' : '付款確認中') + '</b>：' + E(q.at.slice(5)) + ' 送出「' + (q.kind === '退款' ? '退款 ' + money(q.amount) : q.kind === '儲值並購買' ? '儲值 ' + money(q.amount) + ' 並購買 ' + q.meals + ' 餐' : '儲值 ' + money(q.amount)) + '」（' + E(q.method) + (q.last5 ? ' 末五碼 ' + E(q.last5) : '') + '）。<a href="#" data-pcx style="float:right;text-decoration:underline">取消申請</a><br><small>' + E(q.kind === '退款' ? (q.method === '門市領現' ? '請到門市領取' : '店員會轉到你填的帳號') : (PI.howto[q.method] || '')) + '</small></div>';
}
function acc(key, title, sub, body) {
  var on = OPEN === key;
  return '<div class="mm-acc' + (on ? ' on' : '') + '"><button type="button" class="mm-acch" data-open="' + key + '"><span>' + title + (sub ? '<small>' + sub + '</small>' : '') + '</span><i>' + (on ? '－' : '＞') + '</i></button>' + (on ? '<div class="mm-accb">' + body + '</div>' : '') + '</div>';
}
function mdw(d) { var t = new Date(d + 'T00:00:00Z'); return Number(d.slice(5, 7)) + '/' + Number(d.slice(8)) + '（' + '日一二三四五六'.charAt(t.getUTCDay()) + '）'; }
function vMeals() {
  if (ME.pending) return '<p class="mb-p">資料合併完成後才能訂餐。</p>';
  if (MINE === null) return '<p class="mb-p">載入中…</p>';
  var today = new Date(Date.now() + 8 * 3600000).toISOString().slice(0, 10);
  var list = MINE.filter(function (r) { return PAST ? r.date < today : r.date >= today; });
  var groups = [], seen = {};
  list.forEach(function (r) { var k = r.orderId || r.id; if (!seen[k]) { seen[k] = { key: k, rows: [] }; groups.push(seen[k]); } seen[k].rows.push(r); });
  var h = groups.length ? groups.map(function (g) {
    var r = g.rows[0], open = g.rows.every(function (x) { return x.status === '已預約'; });
    var where = r.pickup === '配送' ? '送到配送點' : r.pickup === '地址' ? '送到我的地址' : '門市自取';
    return '<div class="mm-it"><div class="mm-ith"><b>' + mdw(r.date) + ' ' + E(r.slot) + '</b><span>' + (open ? '<a href="order.html?change=' + encodeURIComponent(r.orderId || r.id) + '&item=' + encodeURIComponent(r.itemId) + '">改期</a><a href="#" ' + (r.orderId ? 'data-cxo="' + E(r.orderId) + '"' : 'data-cx="' + E(r.id) + '"') + '>取消</a>' : '<em>' + E(r.status) + '</em>') + '</span></div>' +
      '<div class="mm-its">' + where + '</div>' + g.rows.map(function (x) { return '<div class="mm-itl">' + E(x.size + ' ' + x.main) + (x.qty > 1 ? ' ×' + x.qty : '') + '・' + E(x.sauce) + '<span>' + (x.kind === '訂閱' ? '方案' : '單點') + (x.charge === '餘額不足改回基本餐' ? '・錢包不足已改回基本餐' : '') + (/配送改自取/.test(x.note || '') ? '・未達門檻改自取' : '') + '</span></div>'; }).join('') + '</div>';
  }).join('') : '<p class="mb-p" style="margin:6px 0 14px">' + (PAST ? '還沒有過去的餐點。' : '還沒有預約，按上方「＋ 訂餐」開始。') + '</p>';
  return h + '<button type="button" class="mm-more" data-past>' + (PAST ? '看即將取餐' : '看過去的餐點') + '</button>';
}
function vPlanTab() {
  var s = ME.sub, m = vManage();
  if (ME.pending) return '<p class="mb-p">資料合併完成後顯示。</p>';
  var h = s ? '<div class="mm-sec">目前方案</div><div class="mb-row"><span>' + s.meals + ' 餐方案（' + E(s.status) + '）</span><span>剩 ' + s.left + ' 餐</span></div><div class="mb-row"><span>期間</span><span>' + E(s.start) + ' ～ ' + E(s.end) + '</span></div>' +
      (OI && OI.sub && OI.sub.upgSize ? '<div class="mb-row"><span>整期升級</span><span>' + E(OI.sub.upgSize + ' ' + OI.sub.upgMain) + '（每餐 +' + OI.sub.upgValue + '）</span></div>' : '') +
      (OI && OI.sub && OI.sub.pauseStart ? '<div class="mb-row"><span>本期暫停</span><span>' + E(OI.sub.pauseStart.slice(5) + ' ～ ' + OI.sub.pauseEnd.slice(5)) + '</span></div>' : '') +
      '<p class="mb-p" style="font-size:12px;margin:8px 0 0">到期前續訂，剩下的餐併入下一期；沒有續訂，已用的餐以單點價計算後，餘額轉入錢包（可申請退現金）。</p><div class="mm-sec" style="margin-top:18px">操作</div>'
    : '<p class="mb-p" style="margin:0 0 12px">目前沒有方案。沒有方案也可以用錢包單點。</p>';
  PS.mode = 'buy';
  h += acc('buy', s ? '續訂方案' : '選擇方案', s ? '剩下的餐會併入下一期' : '8／12／20 餐', PI ? vPlan() : '載入中…');
  if (m) { h += acc('pause', '暫停方案', OI.sub.pauseStart ? '本期已暫停過' : '本期可用 1 次', m.pause); h += acc('upg', '整期升級', OI.sub.upgSize ? '已升級 ' + OI.sub.upgSize + ' ' + OI.sub.upgMain : '一次升級剩下的餐', m.upg); }
  return h;
}
function vWalletTab() {
  var w = ME.wallet;
  if (ME.pending) return '<p class="mb-p">資料合併完成後顯示。</p>';
  var led = ALLLED ? ME.ledger : ME.ledger.slice(0, 5);
  return '<div class="mb-row"><span>總餘額</span><span><b>' + money(w.total) + '</b></span></div><div class="mb-row"><span>可退現金</span><span>' + money(w.cash) + '</span></div><div class="mb-row"><span>紅利（只能消費，不能退現金）</span><span>' + money(w.bonus) + '</span></div><div style="height:12px"></div>' +
    acc('topup', '儲值', '轉帳、LINE Pay 或到門市付現', PI ? (function () { PS.mode = 'topup'; var x = vPlan(); PS.mode = 'buy'; return x; })() : '載入中…') +
    acc('refund', '申請退款', '退回可退現金', vRefund()) +
    '<div class="mm-sec" style="margin-top:18px">' + (ALLLED ? '全部紀錄' : '最近紀錄') + '</div>' + (led.length ? led.map(function (r) { return '<div class="mb-row"><span>' + E(r.at.slice(5, 10).replace('-', '/')) + '　' + E(r.type) + '</span><span>' + (r.amount >= 0 ? '+' : '−') + Math.abs(r.amount).toLocaleString('en-US') + (r.amount > 0 && !r.refundable ? ' <span class="mb-tag">紅利</span>' : '') + '</span></div>'; }).join('') : '<div class="mb-row"><span>還沒有紀錄</span><span></span></div>') +
    (ME.ledger.length > 5 ? '<button type="button" class="mm-more" data-allled>' + (ALLLED ? '只看最近' : '看全部紀錄') + '</button>' : '');
}
function vRefTab() {
  if (ME.pending) return '<p class="mb-p">資料合併完成後顯示。</p>';
  return '<div style="text-align:center;padding:10px 0 4px"><div class="mm-sec">我的推薦碼</div><div class="mm-code">' + E(ME.code) + '</div><button class="hb-btn g" style="display:block;width:100%" id="cp">複製推薦碼</button></div>' +
    '<div class="mm-sec" style="margin-top:20px">怎麼拿紅利</div><div class="mb-row"><span>朋友第一次訂閱時填你的推薦碼</span><span>朋友得紅利</span></div><div class="mb-row"><span>朋友取餐滿 ' + ME.referrerMeals + ' 餐</span><span>你得 ' + money(ME.referrerBonus) + ' 紅利</span></div>' +
    '<p class="mb-p" style="font-size:12px;margin:8px 0 0">紅利只能用來消費（升級、加購、單點），不能退現金。</p>';
}
function vAccTab() {
  var prof = EDIT ? '<div class="mb-f"><label>姓名</label><input id="e-name" value="' + E(ME.name) + '"></div><div class="mb-f"><label>Email（選填）</label><input id="e-email" type="email" value="' + E(ME.email) + '"></div>' +
      (ME.needPhone ? '<div class="mb-f"><label>手機</label><input id="e-phone" inputmode="tel"></div>' : '<p class="mb-p" style="font-size:12px;margin:0 0 10px">手機修改請洽門市。</p>') +

    else if (pb.hasAttribute('data-pmode')) PS.mode = pb.getAttribute('data-pmode');
    else if (pb.hasAttribute('data-pcx')) { if (confirm('取消這筆付款申請？')) Z.post({ action: 'payCancel' }).then(load).catch(function (er) { alert(er.message); }); return; }
    else if (pb.hasAttribute('data-pbuy')) { if (!confirm('用錢包' + (PI.sub ? '續訂 ' : '購買 ') + PS.meals + ' 餐方案？')) return; pb.disabled = true; Z.post({ action: 'payBuy', meals: PS.meals, code: PS.code }).then(function () { PI = null; PS.code = ''; load(); }).catch(function (er) { pb.disabled = false; say('p-msg', er.message); }); return; }
    else if (pb.hasAttribute('data-preq')) { pb.disabled = true; Z.post({ action: 'payRequest', kind: TAB === 'wallet' ? '儲值' : '儲值並購買', meals: PS.meals, amount: PS.amt, code: PS.code, method: PS.method, last5: PS.l5 }).then(function () { PI = null; load(); }).catch(function (er) { pb.disabled = false; say('p-msg', er.message); }); return; }
    draw(); return;
  }
  if (t.id === 'cp') { try { navigator.clipboard.writeText(ME.code); t.textContent = '已複製'; } catch (x) { prompt('推薦碼', ME.code); } }
});
// 輸入框的內容記在 PS，畫面重畫（例如切換付款方式）時不會被清掉
document.addEventListener('change', function (e) { if (e.target.id === 'z-start') { PZ.start = e.target.value; draw(); } });
document.addEventListener('input', function (e) { if (e.target.id === 'rf-amt') RF.amt = e.target.value; if (e.target.id === 'rf-acct') RF.acct = e.target.value; });
document.addEventListener('input', function (e) { if (e.target.id === 'p-code') PS.code = e.target.value.trim().toUpperCase(); if (e.target.id === 'p-l5') PS.l5 = e.target.value.trim(); });
Z.init('healthy', load);
</script>
</body>
</html>
