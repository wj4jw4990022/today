<script>
Z.init('home', function (d) {
  function one(id) { return d.shops.filter(function (s) { return s.id === id; })[0]; }
  function stat(s, extra) {
    var st = s && s.showHours ? Z.hoursState(s) : null, parts = [];
    if (st) parts.push('<span class="dot' + (st.state === 'open' ? ' open' : '') + '"></span><span>' + Z.esc(/^今日/.test(st.text) ? st.text : '今日' + (st.state === 'open' ? '' : ' ') + st.text) + '</span>');
    if (extra) parts.push('<span>' + Z.esc(extra) + '</span>');
    return parts.join('<span style="opacity:.5">｜</span>');
  }
  var hk = d.shops.filter(function (s) { return s.hall === '漢口總店'; }), fl = hk.map(function (s) { return parseInt(s.floor, 10); }).filter(Boolean).sort();
  var hs = one('h1'), ps = one('p');
  document.getElementById('st-h').innerHTML = stat(hs, hk.length ? (fl.length ? fl[0] + 'F–' + fl[fl.length - 1] + 'F' : '') : '');
  document.getElementById('st-p').innerHTML = stat(ps, ps && ps.closed && ps.closed.length ? ps.closed.map(function (n) { return '週' + Z.wd[n]; }).join('、') + '公休' : '');
  var list = d.shops.filter(function (s) { return s.showHours; });
  if (!list.length) return;
  var n = new Date(), tz = new Date(n.toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
  document.getElementById('tdate').textContent = (tz.getMonth() + 1) + ' 月 ' + tz.getDate() + ' 日　週' + Z.wd[tz.getDay()];
  document.getElementById('today').innerHTML = list.map(function (s) {
    var st = Z.hoursState(s), href = s.hall === '漢口總店' ? 'shop.html?id=' + encodeURIComponent(s.id) : 'huangpu.html';
    var fl2 = s.hall === '漢口總店' ? String(s.floor).split(' ')[0] : '黃埔';
    return '<a class="tr" href="' + href + '"><span class="en">' + Z.esc(fl2) + '</span><span class="sn">' + Z.esc(s.name) + '</span><span class="hh">' + (st && st.state === 'closed' ? '今日公休' : Z.esc(s.hoursStart + '–' + s.hoursEnd)) + '</span>' + (st ? '<span class="stt ' + st.state + '">' + Z.esc(st.text) + '</span>' : '') + '</a>';
  }).join('');
  document.getElementById('tsec').style.display = 'block';
});
</script>
