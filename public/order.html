<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>訂餐｜致日子健康餐</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1E332F">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" media="print" onload="this.media='all'">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/health.css">
<style>
*{border-radius:0!important}
.wz{max-width:1000px;margin:0 auto;padding:30px 24px 120px;display:grid;grid-template-columns:minmax(0,560px) 1fr;gap:32px;align-items:start}
.wz-main{background:var(--bg)}
.wz-adm{grid-column:1/-1;background:#FBF3E3;border:1px solid #e3cf9a;padding:12px 16px;font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.wz-pr{height:4px;background:var(--line);margin:0 0 18px}.wz-pr i{display:block;height:4px;background:var(--gold);transition:width .2s}
.wz-st{font-size:12px;color:var(--gold);letter-spacing:.2em}
.wz-q{font-family:'Noto Serif TC',serif;font-weight:500;font-size:26px;letter-spacing:.06em;margin:6px 0 18px;line-height:1.5}
.wz-q2{font-family:'Noto Serif TC',serif;font-weight:500;font-size:19px;margin:22px 0 12px}
.wz-op{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);padding:14px 16px;margin-bottom:10px;font:inherit;font-size:15px;line-height:1.5;color:var(--ink);cursor:pointer}
.wz-op small{display:block;font-size:12px;color:var(--mute)}
.wz-op.on{border:2px solid var(--gold);background:#fff;padding:13px 15px}
.wz-op[disabled]{opacity:.4;cursor:not-allowed}
.wz-in{margin-left:14px;width:calc(100% - 14px)}
.wz-days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wz-days button{border:1px solid var(--line);background:#fff;text-align:center;padding:8px 0;font:inherit;font-size:12px;line-height:1.5;cursor:pointer;color:var(--ink)}.wz-days b{display:block;font-size:15px;font-weight:500}.wz-days .on{background:var(--dark);color:#EFE8DA;border-color:var(--dark)}.wz-days button[disabled]{opacity:.35;cursor:not-allowed}
.wz-bx{display:flex;gap:12px;border:1px solid var(--line);background:#fff;padding:10px;margin-bottom:10px;align-items:center}
.wz-bx .im{width:64px;height:64px;flex:none;background:#E9E4D8;overflow:hidden}.wz-bx .im img{width:100%;height:100%;object-fit:cover;display:block}
.wz-bx .tx{flex:1;font-size:14px;line-height:1.6;min-width:0}.wz-bx small{color:var(--mute);font-size:12px}
.wz-qt{display:flex;align-items:center}.wz-qt button{width:32px;height:32px;border:1px solid var(--line);background:#fff;font:inherit;font-size:16px;cursor:pointer}.wz-qt b{width:30px;text-align:center}
.wz-tag{display:inline-block;font-size:11px;padding:0 6px;border:1px solid var(--gold);color:var(--gold);margin-left:4px;vertical-align:middle;cursor:pointer;background:transparent;font-family:inherit}
.wz-tag.on{background:var(--gold);color:#fff}
.wz-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.wz-pick button{border:1px solid var(--line);background:#fff;padding:6px;font:inherit;font-size:12px;line-height:1.5;cursor:pointer;color:var(--ink)}.wz-pick .im{aspect-ratio:1/1;background:#E9E4D8;overflow:hidden;margin-bottom:4px}.wz-pick img{width:100%;height:100%;object-fit:cover;display:block}
.wz-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.wz-row span:last-child{text-align:right}
.wz-sel{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;padding:6px 8px;max-width:55%}
.wz-f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.wz-f label{font-size:12px;letter-spacing:.14em;color:var(--mute)}.wz-f input,.wz-f select{font:inherit;font-size:16px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:7px 0;color:var(--ink)}
.wz-ck{display:flex;gap:8px;font-size:14px;border:1px dashed var(--gold);padding:10px 12px;margin:6px 0 10px;line-height:1.6;align-items:flex-start;cursor:pointer}
.wz-add{display:block;width:100%;text-align:center;border:1px dashed var(--gold);color:var(--gold);background:transparent;padding:12px;font:inherit;font-size:14px;cursor:pointer}
.wz-note{font-size:12px;color:var(--mute);line-height:1.8;margin:10px 0 0}
.wz-err{border:1px solid #9a3b2b;color:#9a3b2b;background:#fff;padding:10px 14px;margin:12px 0 0;font-size:14px}
.wz-ft{position:sticky;bottom:0;display:flex;gap:10px;background:var(--bg);padding:14px 0;margin-top:20px;border-top:1px solid var(--line)}
.wz-ft button{flex:1;padding:14px;font:inherit;font-size:14px;letter-spacing:.2em;cursor:pointer}.wz-bk{border:1px solid var(--gold);color:var(--gold);background:transparent}.wz-nx{border:0;background:var(--gold);color:#fff}.wz-nx[disabled]{opacity:.45;cursor:not-allowed}
.wz-side{position:sticky;top:16px;background:var(--card);border:1px solid var(--line);padding:20px}
.wz-ok{border:1px solid var(--gold);background:#fff;padding:26px;text-align:center;grid-column:1/-1}
@media(max-width:860px){.wz{grid-template-columns:1fr;padding:18px 14px 40px}.wz-side{display:none}.wz-ft{position:fixed;left:0;right:0;bottom:0;padding:10px 14px;z-index:5;margin:0}}
</style>
</head>
<body class="hk hx">
<div class="hb-dk"><div id="nav"></div></div>
<main id="main"><div class="wz" id="wz"><p>載入中…</p></div></main>
<div id="foot"></div>
<script src="assets/config.js"></script>
<script src="assets/demo-data.js"></script>
<script src="assets/app.js"></script>
<script>
/* 逐步訂餐（草圖 m41）：一頁一題，6 步。會員用 LINE 登入（cookie）；店員代訂：order.html?admin=1&member=會員ID。
   ?item=便當ID：預先放入購物清單；?change=訂單ID或預約ID：改期（新的訂好後取消舊的）。 */
var E = Z.esc, Q = new URLSearchParams(location.search), ADMIN = Q.get('admin') === '1', MID = Q.get('member') || '', CHANGE = Q.get('change') || '';
var TOK = ''; try { TOK = sessionStorage.getItem('zt') || ''; } catch (e) {}
var D = null, STEP = 1, ERR = '', DONE = null, WD = ['日', '一', '二', '三', '四', '五', '六'], MORE = false, PICKER = false;
var S = { date: '', slot: '', pickup: '自取', point: '', feeOk: true, addr: { id: '', label: '', area: '', address: '', recipient: '', phone: '', note: '', save: true }, lines: [], pay: '錢包' };
function money(n) { return '$' + Number(n || 0).toLocaleString('en-US'); }
function md(d) { var p = d.split('-'); return Number(p[1]) + '/' + Number(p[2]); }
function api(action, body) { return Z.post(Object.assign(ADMIN ? { action: 'admin' + action.charAt(0).toUpperCase() + action.slice(1), idToken: TOK, memberId: MID } : { action: action }, body || {})); }
function pic(u, alt) { return '<img src="' + E(Z.safeUrl(u) || 'assets/illus/bento.svg') + '" alt="' + E(alt) + '" loading="lazy">'; }
function item(id) { return D.items.filter(function (i) { return i.id === id; })[0]; }
function day() { return D.days.filter(function (d) { return d.date === S.date; })[0]; }
function upgv() { return D.sub && D.sub.upgValue || 0; }
function canSub() { var s = D.sub; return s && s.status === '使用中' && s.left > 0 && S.date >= s.start && S.date <= s.end && !(s.pauseStart && S.date >= s.pauseStart && S.date <= s.pauseEnd) && !D.mine.some(function (r) { return r.date === S.date && r.slot === S.slot && r.kind === '訂閱' && r.status !== '已取消'; }); }
function sauceP(id) { var s = D.sauces.filter(function (x) { return x.id === id; })[0]; return s ? s.price : 0; }
function drinkP(ids) { return ids.reduce(function (t, id) { var d = D.drinks.filter(function (x) { return x.id === id; })[0]; return t + (d ? d.price : 0); }, 0); }
function sum() {
  var n = 0, single = 0, later = 0, subUsed = false;
  S.lines.forEach(function (l) { var it = item(l.itemId); if (!it) return; n += l.qty; var add = sauceP(l.sauce) + drinkP(l.drinks); if (l.useSub) { subUsed = true; later += it.upg - upgv() + add; } else single += (it.price + add) * l.qty; });
  var fee = 0, feeNote = '', min = 0;
  if (S.pickup === '地址') { var a = D.extra.areas.filter(function (x) { return x.area === S.addr.area; })[0]; if (a) { min = a.min; fee = n >= a.min ? 0 : a.fee; feeNote = fee ? '未滿 ' + a.min + ' 份' : '滿 ' + a.min + ' 份免運'; } }
  if (S.pickup === '配送點') { var p = point(); if (p) { min = p.min; var have = (D.pointCount || {})[S.date + '|' + S.slot + '|' + p.id] || 0; feeNote = have + n >= p.min ? '目前已達 ' + p.min + ' 份' : (S.feeOk ? '截單時未達 ' + p.min + ' 份才收 ' + money(feeFor(p.km)) : '未達 ' + p.min + ' 份會改門市自取'); } }
  return { n: n, single: single, later: later, fee: fee, feeNote: feeNote, subUsed: subUsed, now: S.pay === '錢包' ? single + fee : 0, cash: S.pay === '現付' ? single + fee : 0 };
}
function point() { return (D.points || []).filter(function (p) { return p.id === S.point; })[0]; }
function feeFor(km) { var f = D.extra.feeOf; return km <= 2 ? f[2] : km <= 5 ? f[5] : f[8]; }
function ok(step) {
  if (step === 1) return S.date && S.slot;
  if (step === 2) return S.pickup === '自取' || (S.pickup === '配送點' && point()) || (S.pickup === '地址' && S.addr.area && S.addr.address.length >= 4 && S.addr.recipient && /^0\d{8,9}$/.test(S.addr.phone.replace(/[\s-]/g, '')));
  if (step === 3) return S.lines.length > 0;
  if (step === 4) return S.lines.every(function (l) { return l.sauce; });
  if (step === 5) { var t = sum(); return S.pay === '錢包' ? t.now <= D.wallet.total : (!D.extra.cash.blocked && D.extra.cash.open < D.extra.cash.limit); }
  return true;
}
var Q1 = ['哪一天要吃？', '怎麼取餐？', '要哪些便當？', '每個便當配什麼醬？', '怎麼付？', '確認訂單'];
function vStep() {
  var d = day(), h = '';
  if (STEP === 1) {
    var days = MORE ? D.days : D.days.slice(0, 7);
    h += '<div class="wz-days">' + days.map(function (x) { return '<button type="button" data-d="' + x.date + '" class="' + (x.date === S.date ? 'on' : '') + '"' + (x.closed ? ' disabled' : '') + '><b>' + md(x.date) + '</b>' + (x.closed ? '公休' : WD[x.wd]) + '</button>'; }).join('') + (!MORE && D.days.length > 7 ? '<button type="button" data-more><b>更多</b>⋯</button>' : '') + '</div>';
    if (d) h += '<div class="wz-q2">中午還是晚上？</div>' + d.slots.map(function (s) { var full = s.left !== null && s.left < 1; return '<button type="button" class="wz-op' + (S.slot === s.slot ? ' on' : '') + '" data-s="' + s.slot + '"' + (full ? ' disabled' : '') + '>' + s.slot + '<small>門市自取 ' + E(s.pickup) + (s.left === null ? '' : full ? '・已額滿' : '・還可訂 ' + s.left + ' 份') + '</small></button>'; }).join('');
  }
  if (STEP === 2) {
    var pts = (D.points || []).filter(function (p) { return p.slots.indexOf(S.slot) >= 0; });
    h += '<button type="button" class="wz-op' + (S.pickup === '自取' ? ' on' : '') + '" data-pk="自取">到門市自取<small>漢口街 200 號・' + E(d.slots.filter(function (s) { return s.slot === S.slot; })[0].pickup) + '</small></button>';
    h += '<button type="button" class="wz-op' + (S.pickup === '配送點' ? ' on' : '') + '" data-pk="配送點"' + (pts.length ? '' : ' disabled') + '>送到固定配送點<small>' + (pts.length ? '和其他人一起湊份數，滿門檻免運' : '這個時段沒有配送點') + '</small></button>';
    if (S.pickup === '配送點') {
      h += pts.map(function (p) { var n = (D.pointCount || {})[S.date + '|' + S.slot + '|' + p.id] || 0; return '<button type="button" class="wz-op wz-in' + (S.point === p.id ? ' on' : '') + '" data-pt="' + E(p.id) + '">' + E(p.name) + '<small>' + E(p.address || '') + (p.address ? '・' : '') + '已有 ' + n + ' 份，滿 ' + p.min + ' 份免運；未滿配送費 ' + money(feeFor(p.km)) + '</small></button>'; }).join('');
      var pp = point(); if (pp) h += '<label class="wz-ck"><input type="checkbox" id="fee-ok"' + (S.feeOk ? ' checked' : '') + '> 沒達到門檻也要送，願意付配送費 ' + money(feeFor(pp.km)) + '（沒勾＝截單時改門市自取）</label>';
      if (D.eta && D.eta[S.slot]) h += '<p class="wz-note">預計 ' + E(D.eta[S.slot]) + ' 送達（依路況調整，非保證時間）。</p>';
    }
    h += '<button type="button" class="wz-op' + (S.pickup === '地址' ? ' on' : '') + '" data-pk="地址"' + (D.extra.areas.length ? '' : ' disabled') + '>送到我的地址<small>依行政區收配送費；同一筆滿門檻免運</small></button>';
    if (S.pickup === '地址') {
      var A = S.addr, ar = D.extra.areas.filter(function (x) { return x.area === A.area; })[0];
      h += '<div class="wz-in" style="border-left:2px solid var(--gold);padding-left:12px">' +
        (D.extra.addresses.length ? '<div class="wz-f"><label>常用地址</label><select id="ad-pick"><option value="">— 新地址 —</option>' + D.extra.addresses.map(function (x) { return '<option value="' + E(x.id) + '"' + (A.id === x.id ? ' selected' : '') + '>' + E(x.label + '・' + x.area + ' ' + x.address) + '</option>'; }).join('') + '</select></div>' : '') +
        '<div class="wz-f"><label>行政區</label><select id="ad-area"><option value="">請選擇</option>' + D.extra.areas.map(function (x) { return '<option' + (A.area === x.area ? ' selected' : '') + '>' + E(x.area) + '</option>'; }).join('') + '</select></div>' +
        '<div class="wz-f"><label>地址</label><input id="ad-address" value="' + E(A.address) + '" placeholder="路名、門牌、樓層"></div>' +
        '<div class="wz-f"><label>收件人</label><input id="ad-recipient" value="' + E(A.recipient) + '"></div>' +
        '<div class="wz-f"><label>收件人電話</label><input id="ad-phone" inputmode="tel" value="' + E(A.phone) + '"></div>' +
        '<div class="wz-f"><label>備註（選填）</label><input id="ad-note" value="' + E(A.note) + '" placeholder="例：放管理室"></div>' +
        (ar ? '<p class="wz-note" style="margin:0 0 6px">' + E(ar.area) + '：配送費 <b>' + money(ar.fee) + '</b>；這一筆滿 <b>' + ar.min + ' 份</b>免運。不在清單上的區域目前不配送。</p>' : '<p class="wz-note" style="margin:0 0 6px">沒有你的行政區？目前不配送，請改自取或固定配送點。</p>') +
        (A.id ? '' : '<label class="wz-ck"><input type="checkbox" id="ad-save"' + (A.save ? ' checked' : '') + '> 存成常用地址　名稱 <input id="ad-label" value="' + E(A.label) + '" placeholder="例：公司" style="width:90px;border:0;border-bottom:1px solid var(--line);background:transparent;font:inherit"></label>') + '</div>';
    }
  }
  if (STEP === 3) {
    var cs = canSub();
    if (!cs) S.lines.forEach(function (l) { l.useSub = false; });
    h += S.lines.map(function (l, i) { var it = item(l.itemId); return '<div class="wz-bx"><div class="im">' + pic(it.image, it.size + ' ' + it.main) + '</div><div class="tx">' + E(it.size) + '・' + E(it.main) + (l.useSub ? ' <button type="button" class="wz-tag on" data-sub="' + i + '">我的方案</button>' : ' <span class="wz-tag" style="cursor:default">單點</span>' + (cs && !S.lines.some(function (x) { return x.useSub; }) ? ' <button type="button" class="wz-tag" data-sub="' + i + '">改用方案</button>' : '')) + '<br><small>' + it.kcal + ' 大卡・' + it.protein + 'g 蛋白質・' + (l.useSub ? (it.upg - upgv() > 0 ? '扣 1 餐＋' + (it.upg - upgv()) : it.upg - upgv() < 0 ? '扣 1 餐，退 ' + (upgv() - it.upg) : '扣 1 餐') : money(it.price)) + '</small></div><div class="wz-qt"><button type="button" data-q="' + i + '" data-v="-1">' + (l.qty === 1 ? '×' : '−') + '</button><b>' + l.qty + '</b><button type="button" data-q="' + i + '" data-v="1"' + (l.useSub ? ' disabled' : '') + '>＋</button></div></div>'; }).join('');
    h += PICKER ? vPicker() : '<button type="button" class="wz-add" data-addopen>＋ 加一個便當（看全部照片）</button>';
    var t = sum(); h += '<p class="wz-note">' + (cs ? '用方案的那一份每個時段只能 1 份，其他都算單點。' : D.sub ? '這一天不能用方案（不在期間、暫停中或這個時段已用過），以下都算單點。' : '沒有方案，以下都算單點。') + (t.n ? '目前共 ' + t.n + ' 份。' : '') + '</p>';
  }
  if (STEP === 4) {
    h += S.lines.map(function (l, i) { var it = item(l.itemId); return '<div class="wz-row"><span>' + E(it.size + '・' + it.main) + (l.qty > 1 ? ' ×' + l.qty : '') + '</span><select class="wz-sel" data-sa="' + i + '">' + D.sauces.map(function (s) { return '<option value="' + E(s.id) + '"' + (l.sauce === s.id ? ' selected' : '') + '>' + E(s.name) + (s.price ? ' +' + s.price : '') + '</option>'; }).join('') + '</select></div>'; }).join('');
    if (D.drinks.length) h += '<div class="wz-q2">要加飲品嗎？</div><p class="wz-note" style="margin:-6px 0 10px">每個便當可以各自加（份數跟著便當）。</p>' + S.lines.map(function (l, i) { var it = item(l.itemId); return '<div class="wz-row"><span>' + E(it.size + '・' + it.main) + '</span><span>' + D.drinks.map(function (dk) { return '<label style="margin-left:8px;cursor:pointer"><input type="checkbox" data-dk="' + i + '" value="' + E(dk.id) + '"' + (l.drinks.indexOf(dk.id) >= 0 ? ' checked' : '') + '> ' + E(dk.name) + ' +' + dk.price + '</label>'; }).join('') + '</span></div>'; }).join('');
  }
  if (STEP === 5) {
    var t5 = sum(), x = D.extra.cash, need = t5.single + t5.fee;
    if (!need) h += '<p class="wz-note" style="font-size:14px">這一筆只有方案的餐，不用另外付錢（升級或加購的差額截單時從錢包扣）。</p>';
    else {
      h += '<button type="button" class="wz-op' + (S.pay === '錢包' ? ' on' : '') + '" data-pay="錢包">錢包付款<small>現在扣 ' + money(need) + '・餘額 ' + money(D.wallet.total) + (D.wallet.bonus ? '（紅利 ' + money(D.wallet.bonus) + ' 先扣）' : '') + (need > D.wallet.total ? '・<b style="color:#9a3b2b">餘額不足，請先到會員頁儲值</b>' : '') + '</small></button>';
      h += '<button type="button" class="wz-op' + (S.pay === '現付' ? ' on' : '') + '" data-pay="現付"' + (x.blocked || x.open >= x.limit ? ' disabled' : '') + '>取餐時付現<small>' + (x.blocked ? '已停用（沒來取餐次數過多），請洽門市' : '門市或配送時收現金 ' + money(need) + '・目前 ' + x.open + ' / ' + x.limit + ' 筆未取') + '</small></button>';
      h += '<p class="wz-note">' + (t5.subUsed ? '方案那 1 份不用付錢（扣 1 餐）。' : '') + (S.pickup === '配送點' ? '配送點的配送費只在截單時沒達門檻、且你願意付時才收，跟著這筆的付款方式。' : '') + '</p>';
    }
  }
  if (STEP === 6) {
    var t6 = sum(), pp6 = point();
    h += '<div class="wz-row"><span>時間</span><span>' + md(S.date) + '（' + WD[d.wd] + '）' + S.slot + '</span></div>';
    h += '<div class="wz-row"><span>取餐</span><span>' + (S.pickup === '自取' ? '門市自取' : S.pickup === '配送點' ? '送到 ' + E(pp6.name) : '送到 ' + E(S.addr.area + ' ' + S.addr.address) + '<br><small>' + E(S.addr.recipient + ' ' + S.addr.phone) + '</small>') + '</span></div>';
    h += S.lines.map(function (l) { var it = item(l.itemId), sn = (D.sauces.filter(function (s) { return s.id === l.sauce; })[0] || {}).name, dn = l.drinks.map(function (id) { return (D.drinks.filter(function (x) { return x.id === id; })[0] || {}).name; }).join('、'); return '<div class="wz-row"><span>' + E(it.size + ' ' + it.main) + '・' + E(sn) + (dn ? '＋' + E(dn) : '') + (l.qty > 1 ? ' ×' + l.qty : '') + '</span><span>' + (l.useSub ? '方案 1 餐' : money((it.price + sauceP(l.sauce) + drinkP(l.drinks)) * l.qty)) + '</span></div>'; }).join('');
    if (S.pickup !== '自取') h += '<div class="wz-row"><span>配送費</span><span>' + (S.pickup === '地址' ? (t6.fee ? money(t6.fee) + '（' + t6.feeNote + '）' : '免運（' + t6.feeNote + '）') : E(t6.feeNote)) + '</span></div>';
    if (t6.later) h += '<div class="wz-row"><span>方案升級／加購</span><span>' + (t6.later > 0 ? '截單時錢包扣 ' + money(t6.later) : '截單時退 ' + money(-t6.later)) + '</span></div>';
    h += '<div class="wz-row"><b>' + (S.pay === '現付' ? '取餐時付現' : '現在從錢包扣') + '</b><b>' + money(S.pay === '現付' ? t6.cash : t6.now) + '</b></div>';
    h += '<p class="wz-note">前一天 ' + E(D.cutoff) + ' 前可以在會員頁修改或取消；之後鎖定。</p>';
  }
  return h;
}
function vPicker() {
  var mains = []; D.items.forEach(function (i) { if (mains.indexOf(i.main) < 0) mains.push(i.main); });
  var order = ['LIGHT', 'BALANCE', 'POWER'];
  return '<div style="border:1px dashed var(--gold);padding:12px;margin-bottom:10px"><div style="display:flex;justify-content:space-between"><b style="font-size:14px">點一個便當加入</b><a href="#" data-addclose>收起</a></div>' + mains.map(function (m) { return '<div style="font-size:12px;color:var(--mute);margin-top:10px">' + E(m) + '</div><div class="wz-pick">' + D.items.filter(function (i) { return i.main === m; }).sort(function (a, b) { return order.indexOf(a.size) - order.indexOf(b.size); }).map(function (i) { return '<button type="button" data-add="' + E(i.id) + '"><div class="im">' + pic(i.image, i.size + ' ' + i.main) + '</div>' + E(i.size) + '<br>' + i.kcal + ' 大卡・' + money(i.price) + '</button>'; }).join('') + '</div>'; }).join('') + '</div>';
}
function vSide() {
  var t = sum(), d = day();
  return '<div class="wz-st">目前的訂單</div>' + '<div class="wz-row"><span>時間</span><span>' + (S.date ? md(S.date) + (S.slot ? ' ' + S.slot : '') : '—') + '</span></div>' +
    '<div class="wz-row"><span>取餐</span><span>' + (STEP < 2 ? '—' : S.pickup === '自取' ? '門市自取' : S.pickup === '配送點' ? (point() ? E(point().name) : '配送點') : E(S.addr.area || '我的地址')) + '</span></div>' +
    (S.lines.length ? S.lines.map(function (l) { var it = item(l.itemId); return '<div class="wz-row"><span>' + E(it.size + ' ' + it.main) + (l.qty > 1 ? ' ×' + l.qty : '') + '</span><span>' + (l.useSub ? '方案' : money(it.price * l.qty)) + '</span></div>'; }).join('') : '<div class="wz-row"><span>便當</span><span>—</span></div>') +
    '<div class="wz-row"><b>' + (S.pay === '現付' ? '取餐付現' : '錢包扣') + '</b><b>' + money(S.pay === '現付' ? t.cash : t.now) + '</b></div>' +
    '<p class="wz-note">錢包餘額 ' + money(D.wallet.total) + (D.sub ? '・方案剩 ' + D.sub.left + ' 餐' : '') + '</p>';
}
function draw() {
  var w = document.getElementById('wz');
  if (DONE) { w.innerHTML = '<div class="wz-ok"><div class="hb-en">Thank you</div><div class="wz-q">訂好了</div><p class="wz-note" style="font-size:14px">' + DONE + '</p><p style="margin-top:16px"><a class="hb-btn g" href="order.html' + (ADMIN ? '?admin=1&member=' + encodeURIComponent(MID) : '') + '">再訂一餐</a> <a class="hb-btn" href="' + (ADMIN ? 'admin.html' : 'member.html') + '">' + (ADMIN ? '回後台' : '回會員頁') + '</a></p></div>'; return; }
  w.innerHTML = (ADMIN ? '<div class="wz-adm"><span>店員代訂模式　會員：<b>' + E(D.member.name) + '・' + E(D.member.id) + '</b>（' + (D.sub ? '剩 ' + D.sub.left + '/' + D.sub.meals + ' 餐・' : '') + '錢包 ' + money(D.wallet.total) + '）</span><a href="admin.html" style="text-decoration:underline">回後台</a></div>' : '') +
    '<div class="wz-main"><div class="wz-pr"><i style="width:' + Math.round(STEP / 6 * 100) + '%"></i></div><div class="wz-st">STEP ' + STEP + ' / 6' + (STEP > 1 && S.date ? '・' + md(S.date) + '（' + WD[day().wd] + '）' + (S.slot || '') : '') + (CHANGE ? '・改期' : '') + '</div><div class="wz-q">' + (STEP === 5 && !sum().single && !sum().fee ? '不用另外付錢' : STEP === 5 ? '單點 ' + money(sum().single + sum().fee) + ' 怎麼付？' : Q1[STEP - 1]) + '</div>' + vStep() +
    (ERR ? '<div class="wz-err">' + E(ERR) + '</div>' : '') +
    '<div class="wz-ft"><button type="button" class="wz-bk" data-back>' + (STEP === 1 ? '取消' : '上一步') + '</button><button type="button" class="wz-nx" data-next' + (ok(STEP) ? '' : ' disabled') + '>' + (STEP === 6 ? (CHANGE ? '確認改期' : '確認訂餐') : '下一步') + '</button></div></div>' +
    '<aside class="wz-side">' + vSide() + '</aside>';
}
function login() { try { localStorage.setItem('zr_after', location.pathname + location.search); } catch (e) {} document.getElementById('wz').innerHTML = '<div class="wz-ok"><div class="wz-q">訂餐需要會員登入</div><a class="hb-btn g" href="/api/line/login">用 LINE 登入</a> <a class="hb-btn" href="healthy.html">看菜單</a></div>'; }
function addLine(id) { if (!item(id)) return; var cs = canSub() && !S.lines.some(function (l) { return l.useSub; }); var f = D.sauces.filter(function (s) { return !s.price; })[0] || D.sauces[0]; S.lines.push({ itemId: id, qty: 1, useSub: cs, sauce: f ? f.id : '', drinks: [] }); }
function load() {
  return api('orderInfo').then(function (d) {
    D = d; var pre = Q.get('item');
    var f = D.days.filter(function (x) { return !x.closed; })[0]; if (f && !S.date) S.date = f.date;
    if (D.extra.addresses[0]) { var a = D.extra.addresses[0]; S.addr = { id: a.id, label: a.label, area: a.area, address: a.address, recipient: a.recipient, phone: a.phone, note: a.note, save: false }; }
    else if (!ADMIN) S.addr.recipient = D.member.name;
    if (pre && item(pre)) S.preItem = pre;
    draw();
  }).catch(function (e) { if (!ADMIN && /登入/.test(e.message)) return login(); if (!ADMIN && /註冊|合併/.test(e.message)) { location.href = 'member.html'; return; } document.getElementById('wz').innerHTML = '<div class="wz-err">' + E(e.message) + '</div>'; });
}
function readAddr() { ['address', 'recipient', 'phone', 'note', 'label'].forEach(function (k) { var el = document.getElementById('ad-' + k); if (el) S.addr[k] = el.value.trim(); }); var sv = document.getElementById('ad-save'); if (sv) S.addr.save = sv.checked; }
document.addEventListener('input', function (e) { if (/^ad-/.test(e.target.id)) { readAddr(); var nx = document.querySelector('[data-next]'); if (nx) nx.disabled = !ok(STEP); } });
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'fee-ok') S.feeOk = t.checked;
  else if (t.id === 'ad-area') { readAddr(); S.addr.area = t.value; }
  else if (t.id === 'ad-pick') { var a = D.extra.addresses.filter(function (x) { return x.id === t.value; })[0]; S.addr = a ? { id: a.id, label: a.label, area: a.area, address: a.address, recipient: a.recipient, phone: a.phone, note: a.note, save: false } : { id: '', label: '', area: '', address: '', recipient: D.member.name, phone: '', note: '', save: true }; }
  else if (t.id === 'ad-save') { S.addr.save = t.checked; return; }
  else if (t.hasAttribute('data-sa')) S.lines[Number(t.getAttribute('data-sa'))].sauce = t.value;
  else if (t.hasAttribute('data-dk')) { var l = S.lines[Number(t.getAttribute('data-dk'))], k = l.drinks.indexOf(t.value); if (t.checked && k < 0) l.drinks.push(t.value); if (!t.checked && k >= 0) l.drinks.splice(k, 1); }
  else return;
  draw();
});
document.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('button,a[data-addclose]'); if (!b || !D || b.disabled) return;
  if (b.hasAttribute('data-addclose')) { e.preventDefault(); PICKER = false; }
  else if (b.hasAttribute('data-d')) { S.date = b.getAttribute('data-d'); S.slot = ''; }
  else if (b.hasAttribute('data-more')) MORE = true;
  else if (b.hasAttribute('data-s')) S.slot = b.getAttribute('data-s');
  else if (b.hasAttribute('data-pk')) { readAddr(); S.pickup = b.getAttribute('data-pk'); }
  else if (b.hasAttribute('data-pt')) S.point = b.getAttribute('data-pt');
  else if (b.hasAttribute('data-addopen')) PICKER = true;
  else if (b.hasAttribute('data-add')) { addLine(b.getAttribute('data-add')); PICKER = false; }
  else if (b.hasAttribute('data-sub')) { var i = Number(b.getAttribute('data-sub')), on = !S.lines[i].useSub; S.lines.forEach(function (l) { l.useSub = false; }); S.lines[i].useSub = on; if (on) S.lines[i].qty = 1; }
  else if (b.hasAttribute('data-q')) { var j = Number(b.getAttribute('data-q')), v = Number(b.getAttribute('data-v')); S.lines[j].qty += v; if (S.lines[j].qty < 1) S.lines.splice(j, 1); else if (S.lines[j].qty > 20) S.lines[j].qty = 20; }
  else if (b.hasAttribute('data-pay')) S.pay = b.getAttribute('data-pay');
  else if (b.hasAttribute('data-back')) { if (STEP === 1) { location.href = ADMIN ? 'admin.html' : 'member.html'; return; } readAddr(); STEP--; ERR = ''; scrollTo(0, 0); }
  else if (b.hasAttribute('data-next')) {
    readAddr();
    if (STEP === 2 && S.preItem && !S.lines.length) { addLine(S.preItem); S.preItem = ''; }
    if (STEP === 2 && !S.lines.length) PICKER = true;
    if (STEP === 4 && !sum().single && !sum().fee) S.pay = '錢包';
    if (STEP < 6) { STEP++; ERR = ''; scrollTo(0, 0); draw(); return; }
    b.disabled = true; ERR = '';
    var body = { date: S.date, slot: S.slot, pickup: S.pickup, pointId: S.point, feeOk: S.feeOk, pay: S.pay, addr: S.addr, lines: S.lines.map(function (l) { return { itemId: l.itemId, qty: l.qty, useSub: l.useSub, sauce: l.sauce, drinks: l.drinks }; }) };
    var cancelOld = function () { if (!CHANGE || CHANGE === 'done') return Promise.resolve(); var c = CHANGE; CHANGE = 'done'; return /^O/.test(c) ? api('orderCancelWhole', { orderId: c }) : api('orderCancel', { resId: c }); };
    api('orderCreate2', body).catch(function (er) { if (CHANGE && /已經用方案訂過/.test(er.message)) return cancelOld().then(function () { return api('orderCreate2', body); }); throw er; })
      .then(function (r) { return cancelOld().then(function () { return r; }); })
      .then(function (r) { var t = sum(); DONE = md(S.date) + ' ' + S.slot + '・共 ' + t.n + ' 份。' + (S.pickup === '自取' ? '門市自取。' : S.pickup === '配送點' ? '送到 ' + E(point().name) + '。' : '送到 ' + E(S.addr.area + ' ' + S.addr.address) + '。') + (r.cashDue ? '取餐時付現 ' + money(r.cashDue) + '。' : ''); draw(); })
      .catch(function (er) { ERR = er.message; draw(); });
    return;
  } else return;
  ERR = ''; draw();
});
Z.init('healthy', function () { if (ADMIN && !TOK) { document.getElementById('wz').innerHTML = '<div class="wz-err">請從後台「預約與備餐」進入代訂。</div>'; return; } load(); });
</script>
